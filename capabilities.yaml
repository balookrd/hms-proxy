  - id: ambiguous_global_writes
    method:
      en: >-
        `setMetaConf`, `grant_role`, `revoke_role`, and other namespace-less
        service writes
      ru: >-
        `setMetaConf`, `grant_role`, `revoke_role` и другие namespace-less
        service write RPC
    apache_backend:
      status: rejected
      en: >-
        Safely failed when the request does not resolve exactly one catalog
        under the routing policy.
      ru: >-
        Безопасно отклоняются, если запрос не разрешается ровно в один
        catalog в рамках routing policy.
    hdp_backend:
      status: rejected
      en: >-
        Safely failed when the request does not resolve exactly one catalog
        under the routing policy.
      ru: >-
        Безопасно отклоняются, если запрос не разрешается ровно в один
        catalog в рамках routing policy.
    hive4_backend:
      status: rejected
      en: >-
        Safely failed when the request does not resolve exactly one catalog
        under the routing policy.
      ru: >-
        Безопасно отклоняются, если запрос не разрешается ровно в один
        catalog в рамках routing policy.
    front_door_support:
      en: Any front-door profile.
      ru: Любой front-door profile.
    routing_mode:
      en: >-
        No guessed routing; the mutation must resolve one owned namespace or
        fail safely up front
      ru: >-
        Эвристическая маршрутизация исключена: операция изменения должна строго разрешаться ровно в одно
        пространство имён, иначе запрос немедленно отклоняется с ошибкой
    fallback_strategy:
      en: None.
      ru: Нет.
    semantic_risk:
      en: >-
        Blocked by design to guarantee deterministic routing and prevent silent
        split-brain writes or drifting global state.
      ru: >-
        Заблокировано на уровне архитектуры (by design), чтобы гарантировать детерминированную маршрутизацию и
        предотвратить скрытую рассинхронизацию записей (silent split-brain writes) или расхождение глобального состояния
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#setMetaConfWithoutCatalogContextIsRejectedInMultiCatalogMode

  - id: catalog_registry_rpcs
    method:
      en: "`create_catalog`, `alter_catalog`, `drop_catalog`"
      ru: "`create_catalog`, `alter_catalog`, `drop_catalog`"
    apache_backend:
      status: rejected
      en: >-
        Catalog registry is policy-owned by config, not runtime-managed through
        client RPCs.
      ru: >-
        Реестр каталогов определяется конфигурацией (policy-owned), а не управляется клиентскими RPC во время работы.
    hdp_backend:
      status: rejected
      en: >-
        Catalog registry is policy-owned by config, not runtime-managed through
        client RPCs.
      ru: >-
        Реестр каталогов определяется конфигурацией (policy-owned), а не управляется клиентскими RPC во время работы.
    hive4_backend:
      status: rejected
      en: >-
        Catalog registry is policy-owned by config, not runtime-managed through
        client RPCs.
      ru: >-
        Реестр каталогов определяется конфигурацией (policy-owned), а не управляется клиентскими RPC во время работы.
    front_door_support:
      en: Any front-door profile.
      ru: Любой front-door profile.
    routing_mode:
      en: No routing; catalog registry changes are never proxied.
      ru: "Маршрутизация отсутствует: изменения реестра каталогов никогда не проксируются."
    fallback_strategy:
      en: None.
      ru: Нет.
    semantic_risk:
      en: >-
        Blocked by design so namespace ownership stays explicit and centrally
        governed.
      ru: >-
        Заблокировано на уровне архитектуры (by design), чтобы принадлежность пространств имён оставалась явной и
        централизованно управляемой.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#catalogManagementRpcsAreRejected
