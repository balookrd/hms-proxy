schema_version: 2
capabilities:
  - id: apache_baseline
    status: supported
    client:
      en: >-
        Apache Hive / Spark clients that speak Apache HMS `3.1.3` request wrappers
      ru: >-
        Клиенты Apache Hive / Spark, использующие обёртки запросов
        (request wrappers) Apache HMS `3.1.3`
    front_door:
      profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - catalog-aware reads/writes
        - legacy `catalog<separator>db` routing
        - view rewrite
      ru:
        - catalog-aware read/write
        - legacy `catalog<separator>db` routing
        - view rewrite
    expected_result:
      en: Supported as the baseline deployment.
      ru: Базовый полностью поддерживаемый сценарий.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#dropFunctionRoutesByExplicitDbFirstMethodAllowlist
      - io.github.mmalykhin.hmsproxy.federation.FederationLayerTest#externalizeResultRewritesMaterializedViewTextForClientNamespace
      - io.github.mmalykhin.hmsproxy.federation.FederationLayerTest#externalizeResultKeepsStringLiteralsAndCommentsUntouched
  - id: apache_frontdoor_to_hdp_backend_downgrade
    status: degraded
    client:
      en: >-
        Apache Hive / Spark clients that speak Apache HMS `3.1.3` request wrappers
      ru: >-
        Клиенты Apache Hive / Spark, использующие обёртки запросов
        (request wrappers) Apache HMS `3.1.3`
    front_door:
      profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    backend:
      runtime_profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: Hortonworks `3.1.0.x`
      ru: Hortonworks `3.1.0.x`
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - read paths
        - selected metadata writes that can fall back from `*_req` APIs
      ru:
        - read path
        - часть metadata write, где возможен fallback с `*_req` API
    expected_result:
      en: >-
        Supported with compatibility downgrade; some calls are degraded to
        legacy RPCs.
      ru: >-
        Поддерживается через обратную трансляцию (compatibility downgrade); часть вызовов работает в
        degraded-режиме через legacy RPC.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestFallsBackToLegacyMethodWhenWrapperIsUnsupported
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestCachesUnsupportedWrapperAndSkipsSecondProbe
  - id: hive4_frontdoor_to_apache_backend_downgrade
    status: degraded
    client:
      en: >-
        Hive `4.1.x` clients (beeline, JDBC, Spark, Trino-Hive) that speak the Hive 4
        request-wrapper Thrift API
      ru: >-
        Клиенты Hive `4.1.x` (beeline, JDBC, Spark, Trino-Hive), использующие
        Thrift API обёрток запросов Hive 4
    front_door:
      profiles:
        - APACHE_4_1_0
      en: "`APACHE_4_1_0`"
      ru: "`APACHE_4_1_0`"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
        - APACHE_4_1_0
      en: "`APACHE_3_1_3`, Hortonworks `3.1.0.x`, or `APACHE_4_1_0`"
      ru: "`APACHE_3_1_3`, Hortonworks `3.1.0.x` или `APACHE_4_1_0`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - 199 read/write methods shared with Apache 3.1.3 (binary-compatible)
        - selected Hive 4-only `*_req` wrappers downgraded to positional Apache 3.1.3 RPCs (including `create_table_req`, `get_table_objects_by_name_req`, `get_all_table_constraints`, `delete_column_statistics_req`, `get_max_allocated_table_write_id`, `append_partition_req`)
        - "`lock` with the Hive 4-only `EXCL_WRITE` lock type downgraded to `EXCLUSIVE`"
      ru:
        - 199 read/write методов общих с Apache 3.1.3 (binary-compatible)
        - часть Hive 4-only `*_req` wrappers понижается до позиционных Apache 3.1.3 RPC (включая `create_table_req`, `get_table_objects_by_name_req`, `get_all_table_constraints`, `delete_column_statistics_req`, `get_max_allocated_table_write_id`, `append_partition_req`)
        - "`lock` с Hive 4-only типом `EXCL_WRITE` понижается до `EXCLUSIVE`"
    expected_result:
      en: >-
        Supported with compatibility downgrade for read + standard DDL; Hive 4-only
        APIs (data connectors, scheduled queries, stored procedures, packages, ACID v2
        extensions) respond with `TApplicationException UNKNOWN_METHOD`.
      ru: >-
        Поддерживается через обратную трансляцию (compatibility downgrade) для read + стандартного DDL;
        Hive 4-only API (data connectors, scheduled queries, stored procedures,
        packages, ACID v2 extensions) отвечают `TApplicationException UNKNOWN_METHOD`.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.frontend.Hive4FrontendBridgeTest#bridgeDelegatesCommonRequestWrapperMethods
      - io.github.mmalykhin.hmsproxy.frontend.Hive4FrontendBridgeTest#bridgeMapsHive4OnlyGetDatabaseReqToLegacyApacheMethod
      - io.github.mmalykhin.hmsproxy.frontend.Hive4FrontendBridgeTest#bridgeRejectsHive4OnlyDataConnectorMethod
      - io.github.mmalykhin.hmsproxy.frontend.FrontendBridgeThriftSerializationTest#hive4GetPartitionsReqSerializesPartitionsResponse
      - io.github.mmalykhin.hmsproxy.frontend.FrontendBridgeThriftSerializationTest#hive4ExclWriteLockDowngradesToExclusive
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#partitionRequestsFallbackOnLegacyApacheBackend
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getTableReqRoutesToHive4PreservingColStatsAndRewritesDb
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#hive4NewRequestsRouteAndFallbackOnLegacyApacheBackend
  - id: apache_frontdoor_to_hive4_backend_upgrade
    status: degraded
    client:
      en: >-
        Apache Hive / Spark clients that speak Apache HMS `3.1.3` request wrappers
      ru: >-
        Клиенты Apache Hive / Spark, использующие обёртки запросов
        (request wrappers) Apache HMS `3.1.3`
    front_door:
      profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    backend:
      runtime_profiles:
        - APACHE_4_1_0
      en: "Hive `4.1.x`"
      ru: "Hive `4.1.x`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - 199 read/write methods shared with Hive 4 via binary-compatible Thrift delegation
        - positional `get_table` and `get_table_objects_by_name` (removed in Hive 4) auto-upgraded
          to their `*_req` equivalents
      ru:
        - 199 read/write методов общих с Hive 4 через binary-compatible Thrift делегацию
        - позиционные `get_table` и `get_table_objects_by_name` (удалены в Hive 4) автоматически
          поднимаются до `*_req` эквивалентов
    expected_result:
      en: >-
        Supported with compatibility upgrade for the two positional methods Hive 4
        removed; all other RPCs flow through unchanged. Hive 4-only APIs (data
        connectors, scheduled queries, etc.) are not reachable from an Apache 3.1.3
        front door because Apache 3.1.3 has no Thrift bindings for them.
      ru: >-
        Поддерживается через повышение совместимости (compatibility upgrade) для двух позиционных методов,
        удалённых в Hive 4; остальные RPC проходят прозрачно. Hive 4-only API
        (data connectors, scheduled queries и т.п.) недоступны с Apache 3.1.3
        front door, потому что у Apache 3.1.3 нет Thrift bindings для них.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.backend.Hive4BackendAdapterTest#invokeUpgradesGetTableToGetTableReq
      - io.github.mmalykhin.hmsproxy.backend.Hive4BackendAdapterTest#invokeUpgradesGetTableObjectsByNameToReqVersion
      - io.github.mmalykhin.hmsproxy.backend.Hive4BackendAdapterTest#invokeDelegatesCommonMethodWithoutTouchingIt
  - id: hdp_frontdoor_identity_only
    status: supported
    client:
      en: >-
        Hortonworks clients that only expect a Hortonworks front-door identity
        via `getVersion()`
      ru: >-
        Клиенты Hortonworks, которым достаточно идентификации Hortonworks на
        фронтенде через `getVersion()`
    front_door:
      profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: "`HORTONWORKS_*` without standalone jar"
      ru: "`HORTONWORKS_*` без standalone jar"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: "`APACHE_3_1_3` or Hortonworks `3.1.0.x`"
      ru: "`APACHE_3_1_3` или Hortonworks `3.1.0.x`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - overlapping Apache/HDP method families
      ru:
        - пересекающиеся Apache/HDP method families
    expected_result:
      en: Supported when changing the advertised profile is enough for the client.
      ru: >-
        Поддерживается, если клиенту достаточно только смены анонсируемого профиля (advertised profile).
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getVersionUsesConfiguredFrontendProfile
      - io.github.mmalykhin.hmsproxy.frontend.HortonworksFrontendBridgeTest#bridgeDelegatesCommonRequestWrapperMethods
  - id: hdp_only_methods_with_matching_runtime
    status: supported
    client:
      en: Hortonworks clients that call HDP-only thrift request-wrapper methods
      ru: Клиенты Hortonworks, вызывающие HDP-only thrift методы-обёртки (request wrappers)
    front_door:
      profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      requires_standalone_metastore_jar: true
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    backend:
      runtime_profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: Hortonworks `3.1.0.x`
      ru: Hortonworks `3.1.0.x`
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - mapped HDP-only methods
        - runtime-specific passthrough methods
      ru:
        - mapped HDP-only methods
        - runtime-specific passthrough methods
    expected_result:
      en: >-
        Supported when the matching Hortonworks front-door and backend runtime
        jars are configured.
      ru: >-
        Поддерживается при наличии совместимых Hortonworks front-door и backend
        runtime jar.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#addWriteNotificationLogRoutesToResolvedCatalogAndRewritesDb
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getTablesExtRoutesToResolvedCatalogAndRewritesNamespace
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getAllMaterializedViewObjectsForRewritingUsesDefaultHortonworksBackend
  - id: hdp_only_methods_rejected_without_matching_runtime
    status: rejected
    client:
      en: Hortonworks clients that call HDP-only thrift request-wrapper methods
      ru: Клиенты Hortonworks, вызывающие HDP-only thrift методы-обёртки (request wrappers)
    front_door:
      profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      requires_standalone_metastore_jar: true
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - HDP-only passthrough methods such as `add_write_notification_log`
      ru:
        - HDP-only passthrough методы вроде `add_write_notification_log`
    expected_result:
      en: >-
        Rejected explicitly when the target backend does not provide a
        compatible Hortonworks runtime.
      ru: >-
        Явно отклоняется, если target backend не даёт совместимый Hortonworks
        runtime.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#addWriteNotificationLogRejectsNonHortonworksBackendRuntime
  - id: hs2_multicatalog_namespace_rewrite
    status: supported
    client:
      en: HiveServer2 / Beeline SQL workloads across multiple catalogs
      ru: Нагрузки HiveServer2 / Beeline SQL через несколько каталогов
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: "`APACHE_3_1_3` or `HORTONWORKS_*`"
      ru: "`APACHE_3_1_3` или `HORTONWORKS_*`"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      mixed: true
      en: mixed Apache + Hortonworks backends
      ru: смешанные бэкенды Apache + Hortonworks
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - reads
        - DDL/DML
        - namespace rewrite
        - optional view rewrite
      ru:
        - read
        - DDL/DML
        - namespace rewrite
        - optional view rewrite
    expected_result:
      en: Supported as long as routing can resolve the target catalog.
      ru: >-
        Поддерживается, пока маршрутизация может однозначно определить целевой каталог.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyBackendLocksTest#lockRoutesByNamespaceAndRewritesNestedDbName
      - io.github.mmalykhin.hmsproxy.federation.FederationLayerTest#internalizeArgumentRewritesViewTextForLocalAndRemoteCatalogs
      - io.github.mmalykhin.hmsproxy.federation.FederationLayerTest#externalizeResultKeepsForeignCatalogQualifiedReferences
  - id: txn_lock_without_namespace_degraded
    status: degraded
    client:
      en: >-
        HiveServer2 / direct HMS clients using txn/lock lifecycle RPCs without
        namespace in the payload
      ru: >-
        Клиенты HiveServer2 / прямые клиенты HMS, использующие методы жизненного цикла
        транзакций и блокировок (txn/lock) без пространства имён в полезной нагрузке
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      mixed: true
      en: mixed Apache + Hortonworks backends
      ru: смешанные бэкенды Apache + Hortonworks
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - "`open_txns`"
        - "`commit_txn`"
        - "`abort_txn`"
        - "`check_lock`"
        - "`unlock`"
        - "`heartbeat`"
      ru:
        - "`open_txns`"
        - "`commit_txn`"
        - "`abort_txn`"
        - "`check_lock`"
        - "`unlock`"
        - "`heartbeat`"
    expected_result:
      en: >-
        Degraded: pinned to `routing.default-catalog`; eligible non-ACID
        `SELECT`, `NO_TXN` DDL and non-transactional write
        (`INSERT`/`UPDATE`/`DELETE`) locks can still be synthesized on
        non-default catalogs, but otherwise treat this as a single-catalog
        control plane unless you validated otherwise.
      ru: >-
        Degraded: перенаправляются в `routing.default-catalog`; допустимые non-ACID
        `SELECT`, `NO_TXN` DDL и блокировки не-транзакционной записи
        (`INSERT`/`UPDATE`/`DELETE`) всё же могут синтетически
        обслуживаться на каталогах, отличных от default, но в остальном данный контур
        следует рассматривать как single-catalog control plane, пока не проведена отдельная валидация.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyCompatibilityTest#backendLocalTxnAndLockMethodsUseDefaultBackendPathWhenCatalogContextIsMissing
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#syntheticReadLockLifecycleStaysInsideProxyForNonDefaultCatalog
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#syntheticReadLockHeartbeatForwardsTxnHeartbeatToDefaultBackend
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#syntheticSharedWriteInsertLockLifecycleStaysInsideProxyForNonDefaultCatalog
  - id: kerberos_frontdoor_with_impersonation
    status: supported
    client:
      en: >-
        Kerberized HiveServer2 / HMS clients that require end-user identity on
        the backend
      ru: >-
        Клиенты HiveServer2 / HMS с Kerberos, которым требуется передача идентификатора
        конечного пользователя (end-user identity) на бэкенд
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    auth:
      modes:
        - KERBEROS
      impersonation: optional
      en: "`KERBEROS` with optional impersonation"
      ru: "`KERBEROS` с optional impersonation"
    method_families:
      en:
        - front-door SASL
        - local delegation-token issuance
        - backend Hadoop proxy-user, delegation tokens, and `set_ugi()` impersonation
      ru:
        - front-door SASL
        - local delegation-token issuance
        - backend Hadoop proxy-user, delegation tokens и `set_ugi()` имперсонация
    expected_result:
      en: >-
        Supported when proxy-user rules and backend impersonation permissions
        are configured correctly.
      ru: >-
        Поддерживается, если правильно настроены правила proxy-user и разрешения
        имперсонации на бэкенде.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.config.ProxyConfigLoaderTest#loadsImpersonationFlag
      - io.github.mmalykhin.hmsproxy.compatibility.MetastoreCompatibilityTest#localDelegationTokenHandlingRequiresKerberosFrontDoor
  - id: ambiguous_global_writes_and_catalog_registry_rejected
    status: rejected
    client:
      en: >-
        Clients attempting mutations without explicit namespace ownership or
        dynamic catalog registry management
      ru: >-
        Клиенты, пытающиеся выполнять операции изменения без явного владения пространством имён
        (explicit namespace ownership) или динамически управлять реестром каталогов
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - policy-guarded ambiguous mutations
        - "`create_catalog`"
        - "`drop_catalog`"
      ru:
        - policy-guarded ambiguous mutations
        - "`create_catalog`"
        - "`drop_catalog`"
    expected_result:
      en: >-
        Safely failed by design to preserve deterministic routing, explicit
        namespace ownership, and no silent split-brain writes.
      ru: >-
        Безопасно отклоняется на уровне архитектуры (by design), чтобы сохранить детерминированную
        маршрутизацию (deterministic routing), явное владение пространствами имён и предотвратить
        скрытую рассинхронизацию записей (silent split-brain writes).
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#setMetaConfWithoutCatalogContextIsRejectedInMultiCatalogMode
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#grantRoleWithoutCatalogContextIsRejectedInMultiCatalogMode
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#catalogManagementRpcsAreRejected
  - id: ranger_authorization_with_shared_cache
    status: supported
    client:
      en: >-
        HiveServer2 / HMS clients with end-user impersonation or Kerberos identity querying metadata
      ru: >-
        HiveServer2 / HMS клиенты с end-user impersonation или Kerberos identity, запрашивающие метаданные
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
        - APACHE_4_1_0
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
        - APACHE_4_1_0
      wildcard: true
      en: any
      ru: любой
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - metadata reads (`get_all_databases`, `get_databases`, `get_database`, `get_all_tables`, `get_tables`, `get_tables_ext`, `get_table`, `get_table_req`, `get_table_meta`)
        - shared global metadata caching across users
        - per-catalog Ranger policy engine evaluation
      ru:
        - чтение метаданных (`get_all_databases`, `get_databases`, `get_database`, `get_all_tables`, `get_tables`, `get_tables_ext`, `get_table`, `get_table_req`, `get_table_meta`)
        - общий глобальный кэш метаданных для всех пользователей
        - вычисление политик Ranger отдельно по каталогам
    expected_result:
      en: >-
        Metadata is cached once across users when `shared-across-users=true`, and embedded Apache Ranger plugins
        filter database and table listings per user without redundant backend metastore RPCs.
      ru: >-
        Метаданные кэшируются один раз для всех пользователей при `shared-across-users=true`, а встроенные плагины
        Apache Ranger фильтруют списки баз данных и таблиц индивидуально для каждого пользователя без лишних backend RPC.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyRangerTest#testSharedCacheFilteredByRanger
      - io.github.mmalykhin.hmsproxy.security.ranger.RangerMetadataAuthorizerTest#testRangerAuthorizerWithInjectedPolicies
method_matrix:
  - id: object_scoped_reads_and_writes
    method:
      en: >-
        Direct object RPCs such as `get_database`, `get_table`, `create_table`,
        `alter_table`, `drop_table`, `drop_function`
      ru: >-
        Прямые object RPC вроде `get_database`, `get_table`, `create_table`,
        `alter_table`, `drop_table`, `drop_function`
    apache_backend:
      status: supported
      en: Native Apache HMS handling once one catalog is resolved.
      ru: Нативная Apache HMS обработка, как только запрос разрешился в один catalog.
    hdp_backend:
      status: supported
      en: Same routing model for overlapping Apache RPCs on Hortonworks backends.
      ru: Та же routing-модель для пересекающихся Apache RPC на Hortonworks backend.
    hive4_backend:
      status: supported
      en: >-
        Same routing model; positional `get_table` and `get_table_objects_by_name`
        (removed in Hive 4) are auto-upgraded to their `*_req` equivalents by the
        Hive 4 backend adapter, everything else flows through binary-compatible Thrift delegation.
      ru: >-
        Та же routing-модель; позиционные `get_table` и `get_table_objects_by_name`
        (удалены в Hive 4) автоматически поднимаются до `*_req` эквивалентов через
        Hive 4 backend adapter, всё остальное идёт через binary-compatible Thrift делегацию.
    front_door_support:
      en: >-
        `APACHE_3_1_3`; overlapping RPCs also work through `HORTONWORKS_*`
        front doors
      ru: >-
        `APACHE_3_1_3`; пересекающиеся RPC также работают через
        `HORTONWORKS_*` front door
    routing_mode:
      en: >-
        Prefer explicit proxy `catName`, then externalized `dbName` /
        `fullTableName`, else `routing.default-catalog`
      ru: >-
        Сначала явный proxy `catName`, затем externalized `dbName` /
        `fullTableName`, иначе `routing.default-catalog`
    fallback_strategy:
      en: None.
      ru: Нет.
    semantic_risk:
      en: Low, as long as the request resolves one catalog unambiguously.
      ru: Низкий, пока запрос однозначно разрешается в один catalog.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#dropFunctionRoutesByExplicitDbFirstMethodAllowlist

  - id: list_and_discovery_reads
    method:
      en: >-
        List/discovery reads such as `get_all_databases`, `get_databases`,
        `get_all_tables`, `get_tables`, `get_table_meta`
      ru: >-
        List/discovery read RPC вроде `get_all_databases`, `get_databases`,
        `get_all_tables`, `get_tables`, `get_table_meta`
    apache_backend:
      status: supported
      en: Fanout/list aggregation works across Apache backends.
      ru: Агрегация списков через fanout работает поверх бэкендов Apache.
    hdp_backend:
      status: supported
      en: Same fanout/list aggregation model across Hortonworks backends.
      ru: Та же модель агрегации списков через fanout работает и на бэкендах Hortonworks.
    hive4_backend:
      status: supported
      en: Same fanout/list aggregation model across Hive 4 backends.
      ru: Та же модель агрегации списков через fanout работает и на бэкендах Hive 4.
    front_door_support:
      en: Any front-door profile that exposes the overlapping RPCs.
      ru: Любой front-door profile, который экспортирует пересекающиеся RPC.
    routing_mode:
      en: >-
        Fan out across eligible catalogs when no namespace is present; route to
        one backend when `dbName` or `fullTableName` resolves a catalog
      ru: >-
        Параллельный опрос (fanout) по подходящим каталогам при отсутствии пространства имён;
        один бэкенд, если `dbName` или `fullTableName` однозначно определяют каталог
    fallback_strategy:
      en: None beyond namespace externalization and optional selective exposure filtering.
      ru: >-
        Нет, кроме экстернализации пространств имён и опциональной фильтрации видимости.
    semantic_risk:
      en: >-
        Low; list results can be filtered and merged across catalogs, so expect
        externalized names instead of raw backend names
      ru: >-
        Низкий; результаты списочных запросов могут фильтроваться и объединяться между
        каталогами, поэтому клиент видит внешние имена (externalized names), а не внутренние
        имена бэкенда
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAccessControlTest#getAllDatabasesFiltersHiddenDatabasesByExposurePolicy
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getTableMetaRoutesConvertedDoubleDotSchemaPatternToRemoteCatalog

  - id: apache_request_wrappers_to_hdp_backend
    method:
      en: "`get_database_req`, `get_table_req`, `get_table_objects_by_name_req`"
      ru: "`get_database_req`, `get_table_req`, `get_table_objects_by_name_req`"
    apache_backend:
      status: supported
      en: Native Apache request-wrapper handling.
      ru: Нативная обработка Apache request-wrapper методов.
    hdp_backend:
      status: degraded
      en: >-
        Retries legacy `get_database`, `get_table`, or
        `get_table_objects_by_name` when the wrapper API is missing
      ru: >-
        Повторяет вызов через устаревшие методы `get_database`, `get_table` или
        `get_table_objects_by_name`, если метод-обёртка отсутствует
    hive4_backend:
      status: supported
      en: >-
        Native Hive 4 request-wrapper handling; `*_req` methods are the canonical
        Hive 4 shape and reach the backend through binary-compatible delegation.
      ru: >-
        Нативная обработка методов-обёрток Hive 4; форма `*_req` является канонической
        для Hive 4 и доходит до бэкенда через бинарно-совместимую делегацию.
    front_door_support:
      en: "`APACHE_3_1_3`, `HORTONWORKS_3_1_0`, `HORTONWORKS_3_1_5`, or `APACHE_4_1_0`"
      ru: "`APACHE_3_1_3`, `HORTONWORKS_3_1_0`, `HORTONWORKS_3_1_5` или `APACHE_4_1_0`"
    routing_mode:
      en: Same namespace routing as the equivalent direct object RPCs.
      ru: Та же namespace-маршрутизация, что и у эквивалентных direct object RPC.
    fallback_strategy:
      en: >-
        Backend adapter downgrades to the legacy method only on
        `TApplicationException UNKNOWN_METHOD` (or a missing method in the
        loaded runtime) and caches that wrapper as unsupported; other backend
        errors are propagated and never cached
      ru: >-
        Бэкенд-адаптер откатывается к устаревшему методу только при
        `TApplicationException UNKNOWN_METHOD` (или отсутствии метода в
        загруженном runtime) и кэширует данный wrapper как неподдерживаемый; прочие
        ошибки бэкенда пробрасываются и не кэшируются
    semantic_risk:
      en: Low; metadata semantics stay aligned, but the call path becomes legacy.
      ru: >-
        Низкий; семантика метаданных сохраняется, но путь вызова переключается на устаревший.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestFallsBackToLegacyMethodWhenWrapperIsUnsupported
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestPropagatesApplicationErrorsInsteadOfDowngradingToLegacy

  - id: default_catalog_service_reads
    method:
      en: "`getMetaConf`, `get_all_functions`, `get_metastore_db_uuid`"
      ru: "`getMetaConf`, `get_all_functions`, `get_metastore_db_uuid`"
    apache_backend:
      status: degraded
      en: Served from `routing.default-catalog` only.
      ru: Обслуживаются только из `routing.default-catalog`.
    hdp_backend:
      status: degraded
      en: Served from `routing.default-catalog` only.
      ru: Обслуживаются только из `routing.default-catalog`.
    hive4_backend:
      status: degraded
      en: Served from `routing.default-catalog` only.
      ru: Обслуживаются только из `routing.default-catalog`.
    front_door_support:
      en: Any front-door profile that exposes the overlapping RPCs.
      ru: Любой front-door profile, который экспортирует пересекающиеся RPC.
    routing_mode:
      en: Default-catalog pin because the RPC has no catalog namespace.
      ru: Привязка к default-catalog, поскольку у данного RPC нет пространства имён каталога.
    fallback_strategy:
      en: None.
      ru: Нет.
    semantic_risk:
      en: Medium; callers only see one catalog's global service state.
      ru: Средний; клиент видит только global service state одного catalog.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyCompatibilityTest#getMetaConfWithoutCatalogContextUsesDefaultBackend

  - id: compatibility_service_reads
    method:
      en: >-
        `get_current_notificationEventId`, `get_next_notification`,
        `get_notification_events_count`, `get_open_txns`,
        `get_open_txns_info`, `show_locks`, `show_compact`
      ru: >-
        `get_current_notificationEventId`, `get_next_notification`,
        `get_notification_events_count`, `get_open_txns`,
        `get_open_txns_info`, `show_locks`, `show_compact`
    apache_backend:
      status: degraded
      en: >-
        Default-catalog scoped; an empty compatibility response is emitted only
        when the backend does not implement the method.
      ru: >-
        Ограничено каталогом default-catalog; пустой совместимый ответ возвращается
        только тогда, когда бэкенд не реализует метод.
    hdp_backend:
      status: degraded
      en: >-
        Default-catalog scoped; an empty compatibility response is emitted only
        when the backend does not implement the method.
      ru: >-
        Ограничено каталогом default-catalog; пустой совместимый ответ возвращается
        только тогда, когда бэкенд не реализует метод.
    hive4_backend:
      status: degraded
      en: >-
        Default-catalog scoped; an empty compatibility response is emitted only
        when the backend does not implement the method.
      ru: >-
        Ограничено каталогом default-catalog; пустой совместимый ответ возвращается
        только тогда, когда бэкенд не реализует метод.
    front_door_support:
      en: Any front-door profile that exposes the overlapping RPCs.
      ru: Любой front-door profile, который экспортирует пересекающиеся RPC.
    routing_mode:
      en: Default-catalog pin because the RPC has no catalog namespace.
      ru: Привязка к default-catalog, поскольку у данного RPC нет пространства имён каталога.
    fallback_strategy:
      en: >-
        Return an empty or synthetic compatibility response only on
        `TApplicationException UNKNOWN_METHOD` (or a missing method in the
        loaded runtime); transport failures, `MetaException`, and other
        `TApplicationException` types are propagated to the caller
      ru: >-
        Возвращает пустой или синтетический совместимый ответ только при
        `TApplicationException UNKNOWN_METHOD` (или отсутствии метода в
        загруженном runtime); ошибки транспорта, `MetaException` и другие типы
        `TApplicationException` пробрасываются клиенту
    semantic_risk:
      en: >-
        Medium; an empty answer is a statement about ACID, lock, and
        notification state, so it is limited to backends that genuinely lack the
        RPC, while transient failures stay visible as errors
      ru: >-
        Средний; пустой ответ — это утверждение о состоянии ACID, блокировок и
        уведомлений, поэтому он допускается только для бэкендов, где RPC действительно
        отсутствует, а временные сбои (transient failures) остаются видимыми как ошибки
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyCompatibilityTest#notificationMethodsHaveCompatibilityFallbacks
      - io.github.mmalykhin.hmsproxy.compatibility.MetastoreCompatibilityTest#dataSemanticFallbacksOnlyApplyWhenTheBackendHasNoSuchMethod

  - id: privilege_and_token_compatibility_reads
    method:
      en: >-
        `get_privilege_set`, `list_privileges`, `get_role_names`,
        `get_principals_in_role`, `get_role_grants_for_principal`,
        `refresh_privileges`, `get_all_token_identifiers`, `get_master_keys`
      ru: >-
        `get_privilege_set`, `list_privileges`, `get_role_names`,
        `get_principals_in_role`, `get_role_grants_for_principal`,
        `refresh_privileges`, `get_all_token_identifiers`, `get_master_keys`
    apache_backend:
      status: degraded
      en: >-
        Empty or success-shaped compatibility response only when the backend
        does not implement the method.
      ru: >-
        Пустой или имитирующий успех совместимый ответ только тогда, когда бэкенд не
        реализует метод.
    hdp_backend:
      status: degraded
      en: >-
        Empty or success-shaped compatibility response only when the backend
        does not implement the method.
      ru: >-
        Пустой или имитирующий успех совместимый ответ только тогда, когда бэкенд не
        реализует метод.
    hive4_backend:
      status: degraded
      en: >-
        Empty or success-shaped compatibility response only when the backend
        does not implement the method.
      ru: >-
        Пустой или имитирующий успех совместимый ответ только тогда, когда бэкенд не
        реализует метод.
    front_door_support:
      en: Any front-door profile that exposes the overlapping RPCs.
      ru: Любой front-door profile, который экспортирует пересекающиеся RPC.
    routing_mode:
      en: Normal namespace routing, or default-catalog pin when the RPC has no namespace.
      ru: Обычная маршрутизация по пространствам имён либо привязка к default-catalog при их отсутствии.
    fallback_strategy:
      en: >-
        Return an empty or success-shaped compatibility response only on
        `TApplicationException UNKNOWN_METHOD` (or a missing method in the
        loaded runtime); a failed authorization call is never reported as an
        empty privilege set or a successful refresh
      ru: >-
        Возвращает пустой или имитирующий успех совместимый ответ только при
        `TApplicationException UNKNOWN_METHOD` (или отсутствии метода в
        загруженном runtime); неудачный вызов авторизации никогда не
        выдаётся за пустой набор привилегий или успешный refresh
    semantic_risk:
      en: >-
        Medium; an empty privilege answer can be read as an authorization
        decision, so it is limited to backends that genuinely lack the RPC
      ru: >-
        Средний; пустой ответ о привилегиях может быть интерпретирован как решение
        авторизации, поэтому он допускается только для бэкендов, где RPC
        действительно отсутствует
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.compatibility.MetastoreCompatibilityTest#dataSemanticFallbacksOnlyApplyWhenTheBackendHasNoSuchMethod

  - id: optional_service_reads
    method:
      en: "`get_active_resource_plan`, `get_all_resource_plans`, `get_runtime_stats`"
      ru: "`get_active_resource_plan`, `get_all_resource_plans`, `get_runtime_stats`"
    apache_backend:
      status: degraded
      en: Default-catalog scoped and may emit compatibility empty responses.
      ru: Ограничено каталогом default-catalog и может возвращать пустой совместимый ответ.
    hdp_backend:
      status: degraded
      en: Default-catalog scoped and may emit compatibility empty responses.
      ru: Ограничено каталогом default-catalog и может возвращать пустой совместимый ответ.
    hive4_backend:
      status: degraded
      en: Default-catalog scoped and may emit compatibility empty responses.
      ru: Ограничено каталогом default-catalog и может возвращать пустой совместимый ответ.
    front_door_support:
      en: Any front-door profile that exposes the overlapping RPCs.
      ru: Любой front-door profile, который экспортирует пересекающиеся RPC.
    routing_mode:
      en: Default-catalog pin because the RPC has no catalog namespace.
      ru: Привязка к default-catalog, поскольку у данного RPC нет пространства имён каталога.
    fallback_strategy:
      en: >-
        Return an empty compatibility response on any backend failure
        (`TApplicationException`, transport failure, or `MetaException`),
        because these RPCs only expose optional workload-management and
        diagnostic state
      ru: >-
        Возвращает пустой совместимый ответ при любом сбое бэкенда
        (`TApplicationException`, ошибки транспорта или `MetaException`),
        поскольку эти RPC возвращают только опциональные диагностические данные и
        параметры управления рабочей нагрузкой
    semantic_risk:
      en: >-
        Low; an empty answer hides diagnostics, but it does not change data,
        lock, or authorization semantics
      ru: >-
        Низкий; пустой ответ скрывает диагностику, но не меняет семантику
        данных, блокировок и авторизации
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.compatibility.MetastoreCompatibilityTest#optionalServiceReadsStillFallBackOnAnyBackendFailure

  - id: lock_request_namespace_split
    method:
      en: "`lock`"
      ru: "`lock`"
    apache_backend:
      status: supported
      en: Routed by the namespaces its own components name.
      ru: Маршрутизируется по пространствам имён, указанным в его собственных компонентах.
    hdp_backend:
      status: supported
      en: Same component-driven routing on Hortonworks backends.
      ru: Та же маршрутизация по компонентам на бэкендах Hortonworks.
    hive4_backend:
      status: supported
      en: Same component-driven routing on Hive 4 backends.
      ru: Та же маршрутизация по компонентам на бэкендах Hive 4.
    front_door_support:
      en: Any front-door profile.
      ru: Любой front-door profile.
    routing_mode:
      en: >-
        Components are grouped by catalog. A request naming several catalogs is
        routed by one of them - the default catalog whenever it is present, since
        it owns the TxnHandler - and each surviving component is internalized
        against its own database, so a request spanning two databases of one
        catalog reaches the backend intact.
      ru: >-
        Компоненты группируются по каталогам. Запрос, затрагивающий несколько
        каталогов, маршрутизируется по одному из них — по default catalog, если
        он присутствует, так как ему принадлежит TxnHandler, — и каждый оставшийся
        компонент интернализуется по своей базе, поэтому запрос к двум базам
        одного каталога доходит до бэкенда целиком.
    fallback_strategy:
      en: >-
        Components of the other catalogs are dropped from the request that
        reaches the backend, logged, and counted by
        `hms_proxy_lock_request_split_total`. Nothing held is lost: non-default
        catalogs are served by the synthetic shim, which records a lock and
        reports it acquired without ever testing for a conflict. Catalog access
        mode is still enforced on dropped components.
      ru: >-
        Компоненты остальных каталогов удаляются из запроса к бэкенду, записываются в
        лог и учитываются метрикой `hms_proxy_lock_request_split_total`. Ни одна
        удерживаемая блокировка при этом не теряется: каталоги, отличные от default, обслуживает
        synthetic shim, который фиксирует блокировку и отвечает «получена», не
        проверяя конфликт. Режим доступа каталога (access mode) для отброшенных компонентов
        по-прежнему соблюдается.
    semantic_risk:
      en: >-
        Medium; a cross-catalog statement keeps a real lock only in the default
        catalog, and the shim gives no writer isolation anywhere else
      ru: >-
        Средний; межкаталожная операция сохраняет реальную блокировку только в
        default catalog, а synthetic shim нигде больше не обеспечивает изоляции писателей
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#lockRequestSpanningTwoCatalogsRoutesToTheDefaultCatalog
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#lockRequestSpanningTwoDatabasesOfOneCatalogKeepsEveryComponent

  - id: txn_lock_lifecycle_without_namespace
    method:
      en: >-
        `open_txns`, `commit_txn`, `abort_txn`, `abort_txns`, `check_lock`,
        `unlock`, `heartbeat`, `heartbeat_txn_range`
      ru: >-
        `open_txns`, `commit_txn`, `abort_txn`, `abort_txns`, `check_lock`,
        `unlock`, `heartbeat`, `heartbeat_txn_range`
    apache_backend:
      status: degraded
      en: >-
        Pinned to `routing.default-catalog`; synthetic lock shim only helps
        non-ACID `SELECT`, eligible `NO_TXN` DDL and non-transactional write
        locks on non-default catalogs
      ru: >-
        Привязываются к `routing.default-catalog`; synthetic lock shim помогает
        только для non-ACID `SELECT`, допустимых `NO_TXN` DDL и
        блокировок не-транзакционной записи на каталогах, отличных от default
    hdp_backend:
      status: degraded
      en: Same default-catalog control-plane constraint on Hortonworks backends.
      ru: То же ограничение default-catalog control plane на Hortonworks backend.
    hive4_backend:
      status: degraded
      en: >-
        Same default-catalog control-plane constraint on Hive 4 backends; Hive 4
        ACID v2 extensions are not exposed by this proxy and stay out of scope.
      ru: >-
        То же ограничение default-catalog control plane на Hive 4 backend; ACID v2
        расширения Hive 4 этим proxy не публикуются и остаются за рамками.
    front_door_support:
      en: Any front-door profile.
      ru: Любой front-door profile.
    routing_mode:
      en: Default-catalog pin once only ids remain in the payload.
      ru: Привязка к default-catalog, как только в полезной нагрузке остаются только идентификаторы (ids).
    fallback_strategy:
      en: >-
        Synthetic lock shim for eligible non-default-catalog lock cases,
        otherwise the normal default-backend txn/lock lifecycle
      ru: >-
        Synthetic lock shim для допустимых случаев блокировок на каталогах, отличных от default,
        в остальных случаях — штатный жизненный цикл txn/lock на дефолтном бэкенде
    semantic_risk:
      en: >-
        High; treat this as a single-catalog control plane unless you validated
        the exact workload end to end
      ru: >-
        Высокий; данный контур следует рассматривать как single-catalog control plane, пока не протестирован
        точный сценарий нагрузки сквозным образом
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyCompatibilityTest#backendLocalTxnAndLockMethodsUseDefaultBackendPathWhenCatalogContextIsMissing

  - id: acid_object_payload_rpcs
    method:
      en: >-
        `get_valid_write_ids`, `allocate_table_write_ids`, `compact`,
        `compact2`, `add_dynamic_partitions`, `fire_listener_event`,
        `repl_tbl_writeid_state`
      ru: >-
        `get_valid_write_ids`, `allocate_table_write_ids`, `compact`,
        `compact2`, `add_dynamic_partitions`, `fire_listener_event`,
        `repl_tbl_writeid_state`
    apache_backend:
      status: unsafe
      en: Routed by payload namespace when one can be extracted.
      ru: Маршрутизируются по payload namespace, если его удаётся извлечь.
    hdp_backend:
      status: unsafe
      en: Same payload-based routing, but backend/runtime semantics still need validation.
      ru: >-
        Та же payload-based маршрутизация, но backend/runtime semantics всё
        равно требуют отдельной валидации
    hive4_backend:
      status: unsafe
      en: >-
        Same payload-based routing; Hive 4 has additional ACID v2 lifecycle RPCs
        that this proxy does not expose, so multi-catalog ACID semantics still need
        validation per workload.
      ru: >-
        Та же payload-based маршрутизация; у Hive 4 есть дополнительные ACID v2
        lifecycle RPC, которые этот proxy не публикует, так что multi-catalog ACID
        semantics всё равно требуют валидации под конкретный workload.
    front_door_support:
      en: Any front-door profile that exposes the RPC.
      ru: Любой front-door profile, который экспортирует RPC.
    routing_mode:
      en: >-
        Extract `dbName` or `fullTableName` from the payload; if no object
        namespace survives, fall back to the default-catalog lifecycle rules
      ru: >-
        Извлечь `dbName` или `fullTableName` из payload; если object namespace
        не остаётся, перейти к правилам default-catalog lifecycle
    fallback_strategy:
      en: No semantic downgrade beyond payload extraction.
      ru: Нет semantic downgrade, кроме самого payload extraction.
    semantic_risk:
      en: >-
        High; ACID and write-id semantics are not guaranteed safe across
        catalogs, so treat these RPCs as production-unsafe until validated
      ru: >-
        Высокий; ACID и write-id semantics не гарантированно безопасны между
        каталогами, поэтому эти RPC стоит считать production-unsafe до
        отдельной валидации
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyBackendLocksTest#lockRoutesByNamespaceAndRewritesNestedDbName

  - id: hdp_frontdoor_bridge_safe_mappings
    method:
      en: >-
        `get_database_req`, `truncate_table_req`, `alter_table_req`,
        `alter_partitions_req`, `rename_partition_req`,
        `get_partitions_by_names_req`,
        `update_table_column_statistics_req`,
        `update_partition_column_statistics_req`
      ru: >-
        `get_database_req`, `truncate_table_req`, `alter_table_req`,
        `alter_partitions_req`, `rename_partition_req`,
        `get_partitions_by_names_req`,
        `update_table_column_statistics_req`,
        `update_partition_column_statistics_req`
    apache_backend:
      status: supported
      en: Frontend bridge adapts the HDP wrapper to Apache handler equivalents.
      ru: Frontend bridge адаптирует HDP wrapper к Apache handler equivalents.
    hdp_backend:
      status: supported
      en: Same bridge on the front door, then normal routing to the resolved backend.
      ru: >-
        Тот же bridge на front door, после чего выполняется обычная
        маршрутизация в разрешённый backend
    hive4_backend:
      status: supported
      en: >-
        Same bridge on the front door produces an Apache-shaped request that flows
        through binary-compatible delegation to the Hive 4 backend.
      ru: >-
        Тот же bridge на front door выдаёт Apache-форму запроса, которая идёт через
        binary-compatible делегацию в Hive 4 backend.
    front_door_support:
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    routing_mode:
      en: Follows the bridged Apache equivalent for namespace and default-catalog policy.
      ru: >-
        Следует логике bridged Apache equivalent для namespace и
        default-catalog policy
    fallback_strategy:
      en: Frontend bridge rewrites the request and, when needed, the response type.
      ru: >-
        Frontend bridge переписывает request и, при необходимости,
        response type
    semantic_risk:
      en: Low for request shapes that have a safe Apache mapping.
      ru: Низкий для тех request shapes, у которых есть safe Apache mapping.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.frontend.HortonworksFrontendBridgeTest#bridgeDelegatesCommonRequestWrapperMethods
      - io.github.mmalykhin.hmsproxy.frontend.FrontendBridgeThriftSerializationTest#hortonworksGetPartitionsByNamesReqSerializesPartitions

  - id: hdp_frontdoor_create_table_req
    method:
      en: "`create_table_req`"
      ru: "`create_table_req`"
    apache_backend:
      status: degraded
      en: >-
        Bridged to `create_table`, `create_table_with_environment_context`, or
        `create_table_with_constraints`; rejected when one request mixes
        constraints with `envContext`
      ru: >-
        Транслируется через мост в `create_table`,
        `create_table_with_environment_context` или
        `create_table_with_constraints`; отклоняется, если один запрос
        одновременно содержит constraints и `envContext`
    hdp_backend:
      status: degraded
      en: Same bridge behavior before routing to the resolved backend.
      ru: То же bridge-поведение до маршрутизации в разрешённый backend.
    hive4_backend:
      status: degraded
      en: >-
        Same bridge behavior before routing the resulting Apache-shaped call to
        the Hive 4 backend.
      ru: >-
        То же bridge-поведение до маршрутизации получившегося Apache-вызова в
        Hive 4 backend.
    front_door_support:
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    routing_mode:
      en: Namespace is taken from the table object after bridge conversion.
      ru: Namespace берётся из table object после bridge conversion.
    fallback_strategy:
      en: >-
        Frontend bridge picks the safest Apache equivalent and rejects request
        shapes without a safe mapping
      ru: >-
        Frontend bridge выбирает самый безопасный Apache equivalent и
        отклоняет request shapes без safe mapping
    semantic_risk:
      en: Medium; ordinary shapes are fine, but mixed constraint + envContext requests fail explicitly.
      ru: >-
        Средний; стандартные формы запросов выполняются штатно, но смешанные
        запросы (constraint + envContext) отклоняются с явной ошибкой
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.frontend.HortonworksFrontendBridgeTest#bridgeMapsCreateTableReqToCreateTableWithEnvironmentContext

  - id: hdp_add_write_notification_log
    method:
      en: "`add_write_notification_log`"
      ru: "`add_write_notification_log`"
    apache_backend:
      status: rejected
      en: Apache backends do not provide a compatible Hortonworks extension runtime.
      ru: Apache backend не дают совместимый Hortonworks extension runtime.
    hdp_backend:
      status: supported
      en: Direct Hortonworks passthrough to the resolved Hortonworks backend.
      ru: Прямой Hortonworks passthrough в разрешённый Hortonworks backend.
    hive4_backend:
      status: rejected
      en: Hive 4 backends do not provide the Hortonworks extension runtime.
      ru: Hive 4 backend не предоставляют Hortonworks extension runtime.
    front_door_support:
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    routing_mode:
      en: Explicit namespace routing to one resolved catalog/backend.
      ru: Явная namespace-маршрутизация в один разрешённый catalog/backend.
    fallback_strategy:
      en: None.
      ru: Нет.
    semantic_risk:
      en: Low when the target backend runtime is explicitly Hortonworks.
      ru: Низкий, если target backend runtime явно Hortonworks.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#addWriteNotificationLogRoutesToResolvedCatalogAndRewritesDb

