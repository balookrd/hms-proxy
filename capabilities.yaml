schema_version: 2
capabilities:
  - id: apache_baseline
    status: supported
    client:
      en: >-
        Apache Hive / Spark clients that speak Apache HMS `3.1.3` request wrappers
      ru: >-
        Apache Hive / Spark клиенты, которые говорят через Apache HMS `3.1.3`
        request wrappers
    front_door:
      profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - catalog-aware reads/writes
        - legacy `catalog<separator>db` routing
        - view rewrite
      ru:
        - catalog-aware read/write
        - legacy `catalog<separator>db` routing
        - view rewrite
    expected_result:
      en: Supported as the baseline deployment.
      ru: Базовый полностью поддержанный сценарий.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#dropFunctionRoutesByExplicitDbFirstMethodAllowlist
      - io.github.mmalykhin.hmsproxy.federation.FederationLayerTest#externalizeResultRewritesMaterializedViewTextForClientNamespace
  - id: apache_frontdoor_to_hdp_backend_downgrade
    status: degraded
    client:
      en: >-
        Apache Hive / Spark clients that speak Apache HMS `3.1.3` request wrappers
      ru: >-
        Apache Hive / Spark клиенты, которые говорят через Apache HMS `3.1.3`
        request wrappers
    front_door:
      profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    backend:
      runtime_profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: Hortonworks `3.1.0.x`
      ru: Hortonworks `3.1.0.x`
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - read paths
        - selected metadata writes that can fall back from `*_req` APIs
      ru:
        - read path
        - часть metadata write, где возможен fallback с `*_req` API
    expected_result:
      en: >-
        Supported with compatibility downgrade; some calls are degraded to
        legacy RPCs.
      ru: >-
        Поддержано через compatibility downgrade; часть вызовов работает в
        degraded-режиме через legacy RPC.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestFallsBackToLegacyMethodWhenWrapperIsUnsupported
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestCachesUnsupportedWrapperAndSkipsSecondProbe
  - id: hive4_frontdoor_to_apache_backend_downgrade
    status: degraded
    client:
      en: >-
        Hive `4.1.x` clients (beeline, JDBC, Spark, Trino-Hive) that speak the Hive 4
        request-wrapper Thrift API
      ru: >-
        Hive `4.1.x` клиенты (beeline, JDBC, Spark, Trino-Hive), говорящие на
        Hive 4 request-wrapper Thrift API
    front_door:
      profiles:
        - APACHE_4_1_0
      en: "`APACHE_4_1_0`"
      ru: "`APACHE_4_1_0`"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
        - APACHE_4_1_0
      en: "`APACHE_3_1_3`, Hortonworks `3.1.0.x`, or `APACHE_4_1_0`"
      ru: "`APACHE_3_1_3`, Hortonworks `3.1.0.x` или `APACHE_4_1_0`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - 199 read/write methods shared with Apache 3.1.3 (binary-compatible)
        - selected Hive 4-only `*_req` wrappers downgraded to positional Apache 3.1.3 RPCs
      ru:
        - 199 read/write методов общих с Apache 3.1.3 (binary-compatible)
        - часть Hive 4-only `*_req` wrappers понижается до позиционных Apache 3.1.3 RPC
    expected_result:
      en: >-
        Supported with compatibility downgrade for read + standard DDL; Hive 4-only
        APIs (data connectors, scheduled queries, stored procedures, packages, ACID v2
        extensions) respond with `TApplicationException UNKNOWN_METHOD`.
      ru: >-
        Поддержано через compatibility downgrade для read + стандартного DDL;
        Hive 4-only API (data connectors, scheduled queries, stored procedures,
        packages, ACID v2 extensions) отвечают `TApplicationException UNKNOWN_METHOD`.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.frontend.Hive4FrontendBridgeTest#bridgeDelegatesCommonRequestWrapperMethods
      - io.github.mmalykhin.hmsproxy.frontend.Hive4FrontendBridgeTest#bridgeMapsHive4OnlyGetDatabaseReqToLegacyApacheMethod
      - io.github.mmalykhin.hmsproxy.frontend.Hive4FrontendBridgeTest#bridgeRejectsHive4OnlyDataConnectorMethod
  - id: apache_frontdoor_to_hive4_backend_upgrade
    status: degraded
    client:
      en: >-
        Apache Hive / Spark clients that speak Apache HMS `3.1.3` request wrappers
      ru: >-
        Apache Hive / Spark клиенты, которые говорят через Apache HMS `3.1.3`
        request wrappers
    front_door:
      profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    backend:
      runtime_profiles:
        - APACHE_4_1_0
      en: "Hive `4.1.x`"
      ru: "Hive `4.1.x`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - 199 read/write methods shared with Hive 4 via binary-compatible Thrift delegation
        - positional `get_table` and `get_table_objects_by_name` (removed in Hive 4) auto-upgraded
          to their `*_req` equivalents
      ru:
        - 199 read/write методов общих с Hive 4 через binary-compatible Thrift делегацию
        - позиционные `get_table` и `get_table_objects_by_name` (удалены в Hive 4) автоматически
          поднимаются до `*_req` эквивалентов
    expected_result:
      en: >-
        Supported with compatibility upgrade for the two positional methods Hive 4
        removed; all other RPCs flow through unchanged. Hive 4-only APIs (data
        connectors, scheduled queries, etc.) are not reachable from an Apache 3.1.3
        front door because Apache 3.1.3 has no Thrift bindings for them.
      ru: >-
        Поддержано через compatibility upgrade для двух позиционных методов,
        удалённых в Hive 4; остальные RPC проходят прозрачно. Hive 4-only API
        (data connectors, scheduled queries и т.п.) недоступны с Apache 3.1.3
        front door, потому что у Apache 3.1.3 нет Thrift bindings для них.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.backend.Hive4BackendAdapterTest#invokeUpgradesGetTableToGetTableReq
      - io.github.mmalykhin.hmsproxy.backend.Hive4BackendAdapterTest#invokeUpgradesGetTableObjectsByNameToReqVersion
      - io.github.mmalykhin.hmsproxy.backend.Hive4BackendAdapterTest#invokeDelegatesCommonMethodWithoutTouchingIt
  - id: hdp_frontdoor_identity_only
    status: supported
    client:
      en: >-
        Hortonworks clients that only expect a Hortonworks front-door identity
        via `getVersion()`
      ru: >-
        Hortonworks клиенты, которым достаточно Hortonworks identity на фронте
        через `getVersion()`
    front_door:
      profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: "`HORTONWORKS_*` without standalone jar"
      ru: "`HORTONWORKS_*` без standalone jar"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: "`APACHE_3_1_3` or Hortonworks `3.1.0.x`"
      ru: "`APACHE_3_1_3` или Hortonworks `3.1.0.x`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - overlapping Apache/HDP method families
      ru:
        - пересекающиеся Apache/HDP method families
    expected_result:
      en: Supported when changing the advertised profile is enough for the client.
      ru: >-
        Поддержано, если клиенту достаточно только смены advertised profile.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getVersionUsesConfiguredFrontendProfile
      - io.github.mmalykhin.hmsproxy.frontend.HortonworksFrontendBridgeTest#bridgeDelegatesCommonRequestWrapperMethods
  - id: hdp_only_methods_with_matching_runtime
    status: supported
    client:
      en: Hortonworks clients that call HDP-only thrift request-wrapper methods
      ru: Hortonworks клиенты, которые вызывают HDP-only thrift request-wrapper методы
    front_door:
      profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      requires_standalone_metastore_jar: true
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    backend:
      runtime_profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: Hortonworks `3.1.0.x`
      ru: Hortonworks `3.1.0.x`
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - mapped HDP-only methods
        - runtime-specific passthrough methods
      ru:
        - mapped HDP-only methods
        - runtime-specific passthrough methods
    expected_result:
      en: >-
        Supported when the matching Hortonworks front-door and backend runtime
        jars are configured.
      ru: >-
        Поддержано при наличии совместимых Hortonworks front-door и backend
        runtime jar.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#addWriteNotificationLogRoutesToResolvedCatalogAndRewritesDb
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getTablesExtRoutesToResolvedCatalogAndRewritesNamespace
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#getAllMaterializedViewObjectsForRewritingUsesDefaultHortonworksBackend
  - id: hdp_only_methods_rejected_without_matching_runtime
    status: rejected
    client:
      en: Hortonworks clients that call HDP-only thrift request-wrapper methods
      ru: Hortonworks клиенты, которые вызывают HDP-only thrift request-wrapper методы
    front_door:
      profiles:
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      requires_standalone_metastore_jar: true
      en: "`HORTONWORKS_*` with standalone jar"
      ru: "`HORTONWORKS_*` с standalone jar"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - HDP-only passthrough methods such as `add_write_notification_log`
      ru:
        - HDP-only passthrough методы вроде `add_write_notification_log`
    expected_result:
      en: >-
        Rejected explicitly when the target backend does not provide a
        compatible Hortonworks runtime.
      ru: >-
        Явно отклоняется, если target backend не даёт совместимый Hortonworks
        runtime.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#addWriteNotificationLogRejectsNonHortonworksBackendRuntime
  - id: hs2_multicatalog_namespace_rewrite
    status: supported
    client:
      en: HiveServer2 / Beeline SQL workloads across multiple catalogs
      ru: HiveServer2 / Beeline SQL workloads через несколько каталогов
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      en: "`APACHE_3_1_3` or `HORTONWORKS_*`"
      ru: "`APACHE_3_1_3` или `HORTONWORKS_*`"
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      mixed: true
      en: mixed Apache + Hortonworks backends
      ru: смешанные Apache + Hortonworks backend
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - reads
        - DDL/DML
        - namespace rewrite
        - optional view rewrite
      ru:
        - read
        - DDL/DML
        - namespace rewrite
        - optional view rewrite
    expected_result:
      en: Supported as long as routing can resolve the target catalog.
      ru: >-
        Поддержано, пока routing может однозначно вычислить целевой каталог.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyBackendLocksTest#lockRoutesByNamespaceAndRewritesNestedDbName
      - io.github.mmalykhin.hmsproxy.federation.FederationLayerTest#internalizeArgumentRewritesViewTextForLocalAndRemoteCatalogs
  - id: txn_lock_without_namespace_degraded
    status: degraded
    client:
      en: >-
        HiveServer2 / direct HMS clients using txn/lock lifecycle RPCs without
        namespace in the payload
      ru: >-
        HiveServer2 / direct HMS клиенты, использующие txn/lock lifecycle RPC
        без namespace в payload
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      mixed: true
      en: mixed Apache + Hortonworks backends
      ru: смешанные Apache + Hortonworks backend
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - "`open_txns`"
        - "`commit_txn`"
        - "`abort_txn`"
        - "`check_lock`"
        - "`unlock`"
        - "`heartbeat`"
      ru:
        - "`open_txns`"
        - "`commit_txn`"
        - "`abort_txn`"
        - "`check_lock`"
        - "`unlock`"
        - "`heartbeat`"
    expected_result:
      en: >-
        Degraded: pinned to `routing.default-catalog`; eligible non-ACID
        `SELECT` and `NO_TXN` DDL locks can still be synthesized on
        non-default catalogs, but otherwise treat this as a single-catalog
        control plane unless you validated otherwise.
      ru: >-
        Degraded: идут в `routing.default-catalog`; допустимые non-ACID
        `SELECT` и `NO_TXN` DDL lock всё же могут синтетически обслуживаться
        на non-default catalog, но в остальном это стоит считать
        single-catalog control plane, пока не проведена отдельная валидация.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyCompatibilityTest#backendLocalTxnAndLockMethodsUseDefaultBackendPathWhenCatalogContextIsMissing
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#syntheticReadLockLifecycleStaysInsideProxyForNonDefaultCatalog
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxySyntheticReadLocksTest#syntheticReadLockHeartbeatForwardsTxnHeartbeatToDefaultBackend
  - id: kerberos_frontdoor_with_impersonation
    status: supported
    client:
      en: >-
        Kerberized HiveServer2 / HMS clients that require end-user identity on
        the backend
      ru: >-
        Kerberized HiveServer2 / HMS клиенты, которым нужна end-user identity
        на backend
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    auth:
      modes:
        - KERBEROS
      impersonation: optional
      en: "`KERBEROS` with optional impersonation"
      ru: "`KERBEROS` с optional impersonation"
    method_families:
      en:
        - front-door SASL
        - local delegation-token issuance
        - backend `set_ugi()` impersonation
      ru:
        - front-door SASL
        - local delegation-token issuance
        - backend `set_ugi()` impersonation
    expected_result:
      en: >-
        Supported when proxy-user rules and backend impersonation permissions
        are configured correctly.
      ru: >-
        Поддержано, если правильно настроены proxy-user rules и backend
        impersonation permissions.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.config.ProxyConfigLoaderTest#loadsImpersonationFlag
      - io.github.mmalykhin.hmsproxy.compatibility.MetastoreCompatibilityTest#localDelegationTokenHandlingRequiresKerberosFrontDoor
  - id: ambiguous_global_writes_and_catalog_registry_rejected
    status: rejected
    client:
      en: >-
        Clients attempting mutations without explicit namespace ownership or
        dynamic catalog registry management
      ru: >-
        Клиенты, которые пытаются делать mutation без explicit namespace
        ownership или динамически управлять registry каталогов
    front_door:
      profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    backend:
      runtime_profiles:
        - APACHE_3_1_3
        - HORTONWORKS_3_1_0_3_1_0_78
        - HORTONWORKS_3_1_0_3_1_5_6150_1
      wildcard: true
      en: any
      ru: любой
    auth:
      modes:
        - NONE
        - KERBEROS
      en: "`NONE` or `KERBEROS`"
      ru: "`NONE` или `KERBEROS`"
    method_families:
      en:
        - policy-guarded ambiguous mutations
        - "`create_catalog`"
        - "`drop_catalog`"
      ru:
        - policy-guarded ambiguous mutations
        - "`create_catalog`"
        - "`drop_catalog`"
    expected_result:
      en: >-
        Safely failed by design to preserve deterministic routing, explicit
        namespace ownership, and no silent split-brain writes.
      ru: >-
        Безопасно отклоняется по design, чтобы сохранить deterministic
        routing, explicit namespace ownership и не допустить silent
        split-brain writes.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#setMetaConfWithoutCatalogContextIsRejectedInMultiCatalogMode
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#grantRoleWithoutCatalogContextIsRejectedInMultiCatalogMode
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAuthorizationGuardsTest#catalogManagementRpcsAreRejected
method_matrix:
  - id: object_scoped_reads_and_writes
    method:
      en: >-
        Direct object RPCs such as `get_database`, `get_table`, `create_table`,
        `alter_table`, `drop_table`, `drop_function`
      ru: >-
        Прямые object RPC вроде `get_database`, `get_table`, `create_table`,
        `alter_table`, `drop_table`, `drop_function`
    apache_backend:
      status: supported
      en: Native Apache HMS handling once one catalog is resolved.
      ru: Нативная Apache HMS обработка, как только запрос разрешился в один catalog.
    hdp_backend:
      status: supported
      en: Same routing model for overlapping Apache RPCs on Hortonworks backends.
      ru: Та же routing-модель для пересекающихся Apache RPC на Hortonworks backend.
    hive4_backend:
      status: supported
      en: >-
        Same routing model; positional `get_table` and `get_table_objects_by_name`
        (removed in Hive 4) are auto-upgraded to their `*_req` equivalents by the
        Hive 4 backend adapter, everything else flows through binary-compatible Thrift delegation.
      ru: >-
        Та же routing-модель; позиционные `get_table` и `get_table_objects_by_name`
        (удалены в Hive 4) автоматически поднимаются до `*_req` эквивалентов через
        Hive 4 backend adapter, всё остальное идёт через binary-compatible Thrift делегацию.
    front_door_support:
      en: >-
        `APACHE_3_1_3`; overlapping RPCs also work through `HORTONWORKS_*`
        front doors
      ru: >-
        `APACHE_3_1_3`; пересекающиеся RPC также работают через
        `HORTONWORKS_*` front door
    routing_mode:
      en: >-
        Prefer explicit proxy `catName`, then externalized `dbName` /
        `fullTableName`, else `routing.default-catalog`
      ru: >-
        Сначала явный proxy `catName`, затем externalized `dbName` /
        `fullTableName`, иначе `routing.default-catalog`
    fallback_strategy:
      en: None.
      ru: Нет.
    semantic_risk:
      en: Low, as long as the request resolves one catalog unambiguously.
      ru: Низкий, пока запрос однозначно разрешается в один catalog.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyNamespaceRoutingTest#dropFunctionRoutesByExplicitDbFirstMethodAllowlist

  - id: list_and_discovery_reads
    method:
      en: >-
        List/discovery reads such as `get_all_databases`, `get_databases`,
        `get_all_tables`, `get_tables`, `get_table_meta`
      ru: >-
        List/discovery read RPC вроде `get_all_databases`, `get_databases`,
        `get_all_tables`, `get_tables`, `get_table_meta`
    apache_backend:
      status: supported
      en: Fanout/list aggregation works across Apache backends.
      ru: Fanout/list aggregation работает поверх Apache backend.
    hdp_backend:
      status: supported
      en: Same fanout/list aggregation model across Hortonworks backends.
      ru: Та же модель fanout/list aggregation работает и на Hortonworks backend.
    hive4_backend:
      status: supported
      en: Same fanout/list aggregation model across Hive 4 backends.
      ru: Та же модель fanout/list aggregation работает и на Hive 4 backend.
    front_door_support:
      en: Any front-door profile that exposes the overlapping RPCs.
      ru: Любой front-door profile, который экспортирует пересекающиеся RPC.
    routing_mode:
      en: >-
        Fan out across eligible catalogs when no namespace is present; route to
        one backend when `dbName` or `fullTableName` resolves a catalog
      ru: >-
        Fanout по подходящим catalog при отсутствии namespace; один backend,
        если `dbName` или `fullTableName` разрешает catalog
    fallback_strategy:
      en: None beyond namespace externalization and optional selective exposure filtering.
      ru: >-
        Нет, кроме namespace externalization и optional selective exposure
        filtering.
    semantic_risk:
      en: >-
        Low; list results can be filtered and merged across catalogs, so expect
        externalized names instead of raw backend names
      ru: >-
        Низкий; list results могут фильтроваться и объединяться между
        каталогами, поэтому клиент видит externalized names, а не сырые
        backend names
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.routing.RoutingMetaStoreProxyAccessControlTest#getAllDatabasesFiltersHiddenDatabasesByExposurePolicy

  - id: apache_request_wrappers_to_hdp_backend
    method:
      en: "`get_database_req`, `get_table_req`, `get_table_objects_by_name_req`"
      ru: "`get_database_req`, `get_table_req`, `get_table_objects_by_name_req`"
    apache_backend:
      status: supported
      en: Native Apache request-wrapper handling.
      ru: Нативная обработка Apache request-wrapper методов.
    hdp_backend:
      status: degraded
      en: >-
        Retries legacy `get_database`, `get_table`, or
        `get_table_objects_by_name` when the wrapper API is missing
      ru: >-
        Повторяет вызов через legacy `get_database`, `get_table` или
        `get_table_objects_by_name`, если wrapper API отсутствует
    hive4_backend:
      status: supported
      en: >-
        Native Hive 4 request-wrapper handling; `*_req` methods are the canonical
        Hive 4 shape and reach the backend through binary-compatible delegation.
      ru: >-
        Нативная обработка Hive 4 request-wrapper методов; `*_req` — каноническая
        форма для Hive 4, доходит до backend через binary-compatible делегацию.
    front_door_support:
      en: "`APACHE_3_1_3`"
      ru: "`APACHE_3_1_3`"
    routing_mode:
      en: Same namespace routing as the equivalent direct object RPCs.
      ru: Та же namespace-маршрутизация, что и у эквивалентных direct object RPC.
    fallback_strategy:
      en: >-
        Backend adapter downgrades to the legacy method only on
        `TApplicationException UNKNOWN_METHOD` (or a missing method in the
        loaded runtime) and caches that wrapper as unsupported; other backend
        errors are propagated and never cached
      ru: >-
        Backend adapter деградирует к legacy методу только при
        `TApplicationException UNKNOWN_METHOD` (или отсутствии метода в
        загруженном runtime) и кеширует такой wrapper как unsupported; прочие
        ошибки backend пробрасываются и не кешируются
    semantic_risk:
      en: Low; metadata semantics stay aligned, but the call path becomes legacy.
      ru: >-
        Низкий; metadata semantics сохраняются, но call path становится legacy.
    smoke_tests:
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestFallsBackToLegacyMethodWhenWrapperIsUnsupported
      - io.github.mmalykhin.hmsproxy.backend.HortonworksBackendAdapterTest#invokeRequestPropagatesApplicationErrorsInsteadOfDowngradingToLegacy

