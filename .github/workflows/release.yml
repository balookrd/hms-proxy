name: Release
run-name: "${{ github.workflow }} — ${{ github.event.inputs.series != '' && github.event.inputs.series || 'auto' }}"

on:
  workflow_dispatch:
    inputs:
      series:
        description: "YY.M CalVer series (пусто = текущий UTC месяц, например 26.11)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        name: Compute next version
        env:
          SERIES: ${{ github.event.inputs.series }}
        run: |
          set -euo pipefail

          if [[ -z "$SERIES" ]]; then
            SERIES="$(date -u +%-y.%-m)"
          fi

          if [[ ! "$SERIES" =~ ^[0-9]{2,}\.([1-9]|1[0-2])$ ]]; then
            echo "invalid CalVer series '$SERIES', expected YY.M without leading zero in month (e.g. 26.11)" >&2
            exit 1
          fi

          git fetch origin '+refs/tags/*:refs/tags/*' --force

          latest="$(git tag -l "v${SERIES}.*" --sort=-v:refname | head -n1)"

          if [[ -n "$latest" ]]; then
            patch="${latest##*.}"
            next=$((patch+1))
          else
            next=0
          fi

          version="${SERIES}.${next}"
          tag="v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Next steps
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat <<EOF

          Next release tag: ${TAG}

          Version is derived from git via jgitver, so no source changes are needed.
          Create a signed tag locally on main:

            git fetch origin
            git checkout main
            git pull --ff-only origin main
            git tag -s ${TAG} -m "${TAG}"
            git push origin ${TAG}

          After that, workflow "Tag Release" will build and publish the release.

          EOF
