name: Tag Release
run-name: "${{ github.workflow }} — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_release-build.yml
    with:
      tag: ${{ github.ref_name }}
      prerelease: false
      make_latest: true
