# Default logging shipped inside the fat jar. Kept at operational verbosity on purpose:
# DEBUG on the proxy package renders every request argument and every backend response through
# DebugLogUtil, which is a per-request cost even when nothing consumes the output.
log4j.rootLogger=INFO, console, rollingFile

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %5p [%t] %c{2}: %m%n

log4j.appender.rollingFile=org.apache.log4j.RollingFileAppender
log4j.appender.rollingFile.File=logs/hms-proxy.log
log4j.appender.rollingFile.MaxFileSize=50MB
log4j.appender.rollingFile.MaxBackupIndex=10
log4j.appender.rollingFile.Append=true
log4j.appender.rollingFile.layout=org.apache.log4j.PatternLayout
log4j.appender.rollingFile.layout.ConversionPattern=%d{ISO8601} %5p [%t] %c{2}: %m%n

# Audit records are single-line JSON. They get their own bounded file and no layout prefix so the
# stream stays machine-readable, and additivity is off so audit never mixes into the general log.
log4j.appender.auditFile=org.apache.log4j.RollingFileAppender
log4j.appender.auditFile.File=logs/hms-proxy-audit.log
log4j.appender.auditFile.MaxFileSize=100MB
log4j.appender.auditFile.MaxBackupIndex=10
log4j.appender.auditFile.Append=true
log4j.appender.auditFile.layout=org.apache.log4j.PatternLayout
log4j.appender.auditFile.layout.ConversionPattern=%m%n

log4j.logger.io.github.mmalykhin.hmsproxy=INFO
log4j.logger.io.github.mmalykhin.hmsproxy.audit=INFO, auditFile
log4j.additivity.io.github.mmalykhin.hmsproxy.audit=false
