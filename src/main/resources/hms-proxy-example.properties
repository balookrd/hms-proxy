# -----------------------------------------------------------------------------
# Value syntax
# -----------------------------------------------------------------------------
# The proxy validates configuration at startup and refuses to start on a value it
# cannot interpret, instead of silently falling back to a default:
#   * booleans accept only true / false (any case). yes, on, 1 and typos are errors.
#   * enum values (modes, profiles, policies) are case-insensitive, and an unknown
#     value reports the accepted constants.
#   * durations in HiveConf keys such as hive.metastore.client.socket.timeout accept
#     an integer with an optional Hive unit suffix: ns, us, ms, s/sec, m/min, h/hour,
#     d/day (long spellings work too). No suffix means seconds. An unrecognized value
#     is logged as WARN and the built-in default applies.
#   * combinations that would cancel each other out (see access-mode and the synthetic
#     read-lock store below) are startup errors, and listeners may not share a
#     host:port, including a wildcard bind host such as 0.0.0.0.

# -----------------------------------------------------------------------------
# Listener
# -----------------------------------------------------------------------------
# HMS proxy listener
server.name=hms-proxy
server.bind-host=0.0.0.0
server.port=9083
server.min-worker-threads=32
server.max-worker-threads=512

# Front-door client socket lifetime. libthrift accepts client sockets with an
# infinite read timeout, so a client that dies without FIN/RST (network failure,
# kill behind NAT) pins a worker thread forever and slowly drains
# server.max-worker-threads.
#
# client-socket-timeout-ms is a read timeout: it bounds how long a worker waits
# for the next request on an established connection, and does NOT abort long
# server-side calls such as drop_table with purge (no read is in flight while the
# request is being processed). The default matches the order of magnitude of
# Hive's own hive.metastore.client.socket.timeout (600s); clients wrapped in
# RetryingMetaStoreClient reconnect transparently when an idle connection is
# recycled. Set to 0 to restore the unbounded libthrift behavior.
# server.client-socket-timeout-ms=600000
#
# TCP keepalive detects peers that vanished without FIN/RST. The tuning keys need
# per-socket keepalive options (Linux/macOS); on platforms without them the proxy
# logs once and falls back to the OS-wide tcp_keepalive_* timers.
# Dead-peer detection takes at most idle + interval * count seconds.
# server.tcp-keepalive=true
# server.tcp-keepalive-idle-seconds=120
# server.tcp-keepalive-interval-seconds=30
# server.tcp-keepalive-count=4

# How long the shutdown hook waits for the ordered teardown (additional
# frontends, management listener, router backends, front-door security) after the
# primary listener stops. The JVM halts once the hook returns, so this bounds how
# long in-flight requests may keep the process alive on SIGTERM.
# server.shutdown-timeout-seconds=30

# Optional management listener for Prometheus metrics and health/readiness probes.
# Enabled automatically when management.port is set, or explicitly via management.enabled=true.
# The endpoints are unauthenticated and /readyz exposes Kerberos principals and backend error
# details, so bind this port to a monitoring-only network or restrict it with firewall rules.
# Defaults to server.port + 1000, so keep additional listeners off that port as well.
# management.enabled=true
# management.bind-host=0.0.0.0
# management.port=19083
# Handler threads for the management listener (default 4); keep at least 2 so that a slow
# /readyz cannot block /healthz and /metrics.
# management.threads=4
# How long /readyz reuses backend and Kerberos probe results, in ms (default 2000; 0 disables).
# management.readiness-cache-ms=2000

# Optional additional Thrift frontend listeners on separate ports. Each listener
# advertises its own compatibility.frontend-profile and uses its own standalone
# metastore jar, but shares the routing/federation/security/observability stack
# with the primary listener. Thrift has no version negotiation in the protocol,
# so version-specific clients have to be routed by port (mirroring HiveServer2's
# binary vs HTTP split).
#
# additional-frontends=hdp,hive4
# additional-frontends.hdp.port=9084
# additional-frontends.hdp.frontend-profile=HORTONWORKS_3_1_0_3_1_5_6150_1
# additional-frontends.hdp.standalone-metastore-jar=hive-metastore/hive-standalone-metastore-3.1.0.3.1.5.6150-1.jar
# additional-frontends.hive4.port=9085
# additional-frontends.hive4.frontend-profile=APACHE_3_1_3
# Per-listener overrides default to the primary server.* values:
# additional-frontends.hdp.bind-host=10.0.0.5
# additional-frontends.hdp.min-worker-threads=8
# additional-frontends.hdp.max-worker-threads=64

# Optional Iceberg REST catalog listener. Runs in parallel with the Thrift HMS listener
# and exposes a subset of the Iceberg REST API; see docs for supported operations.
# Enabled automatically when rest-catalog.port is set, or explicitly via rest-catalog.enabled=true.
# rest-catalog.enabled=true
# rest-catalog.bind-host=0.0.0.0
# rest-catalog.port=9183
# rest-catalog.min-worker-threads=8
# rest-catalog.max-worker-threads=64
# Optional SPNEGO/Kerberos protection for the REST listener. Requires security.mode=KERBEROS
# (the Thrift front-door must already have installed a Kerberos UGI). The REST principal
# is a separate HTTP/<host>@REALM (SPNEGO RFC requirement); it is NOT the same as
# security.server-principal (which is hms/<host>@REALM for Thrift). Both principals can
# live in the same keytab or in two separate keytab files.
# rest-catalog.kerberos.principal=HTTP/_HOST@EXAMPLE.COM
# rest-catalog.kerberos.keytab=/etc/security/keytabs/spnego.service.keytab
# What DELETE .../tables/{tbl}?purgeRequested=true may delete. ALLOW (default) deletes whatever the
# table's metadata and manifests point at, the way Iceberg REST catalogs do; ALLOWLIST deletes only
# under the prefixes below, refusing (403) a table outside them and skipping a manifest path outside
# them; REFUSE answers 403 to every purge, leaving a plain drop working. allowed-prefixes is
# required by ALLOWLIST and rejected with the other modes - both contradictions fail at startup.
# rest-catalog.purge.mode=ALLOWLIST
# rest-catalog.purge.allowed-prefixes=hdfs://ns-catalog1/warehouse/tablespace/
# Iceberg's HiveTableOperations writes a Hive-readable storage descriptor only when the Hive engine
# is enabled. Without this, a REST commit rewrites a Hive-created Iceberg table with
# FileInputFormat/FileOutputFormat/LazySimpleSerDe and drops storage_handler, and Hive 3.1 clients
# can no longer read it. A table that sets engine.hive.enabled itself always wins over this.
# rest-catalog.hive-engine-descriptor=true

# -----------------------------------------------------------------------------
# Routing
# -----------------------------------------------------------------------------
# When several catalogs are configured, routing.default-catalog is used for
# legacy requests that do not specify catalog + separator + db explicitly.
routing.default-catalog=catalog1

# Optional separator for legacy database names like catalog1__sales.
# "__" is usually easier to use from Beeline/HS2 than ".".
routing.catalog-db-separator=__

# Optional backend latency tuning. Disabled by default so existing behavior stays unchanged.
# When enabled, the proxy keeps per-catalog latency EWMA, adapts backend socket timeouts,
# opens a circuit after repeated transport/time-budget failures, and can run safe read-only
# fanout RPCs in parallel with degraded omission of slow/unavailable catalogs.
# routing.backend-state-polling.enabled=true
# routing.backend-state-polling.interval-ms=10000
# Optional bound on parallel /readyz and state-polling backend probes.
# Defaults to the number of configured catalogs.
# routing.backend-state-polling.max-parallelism=8
# routing.adaptive-timeout.enabled=true
# routing.adaptive-timeout.initial-ms=5000
# routing.adaptive-timeout.min-ms=1000
# routing.adaptive-timeout.max-ms=60000
# routing.adaptive-timeout.multiplier=4.0
# routing.adaptive-timeout.alpha=0.2
# Cooldown between back-to-back adaptive-timeout reconnects to prevent reconnect storms.
# routing.adaptive-timeout.reconnect-cooldown-ms=30000
# routing.circuit-breaker.enabled=true
# routing.circuit-breaker.failure-threshold=3
# routing.circuit-breaker.open-state-ms=30000
# routing.hedged-read.enabled=true
# routing.hedged-read.max-parallelism=8
# routing.degraded-routing-policy=SAFE_FANOUT_READS

# The Iceberg pointer guard keeps a Hive client's alter_table from erasing the Iceberg state a
# metastore record holds: a HiveServer2 INSERT sends the Table it snapshotted at compile time, and
# the metastore applies those parameters wholesale, metadata_location included. Whether the target
# is an Iceberg table is decided from the metastore record, which costs a get_table per
# alter_table; names answered "not an Iceberg table" are remembered for table-cache-ttl-ms, so
# ordinary Hive tables cost nothing after the first alter. Iceberg tables are never cached, because
# their current pointer has to be read fresh. Set ttl to 0 to read on every alter.
# A repair also holds the table lock Iceberg itself takes (EXCLUSIVE, table level) across its read
# and the backend's alter_table, so a commit cannot land between them. The lock is requested only
# when a repair is needed: a genuine Iceberg commit sends its alter_table from inside that very
# lock, so asking for it earlier would deadlock against the caller. A lock that is not granted
# within lock-acquire-timeout-ms never refuses the write - the alter goes through repaired but
# unprotected, counted as repair_lock_timeout. 0 means one attempt and no waiting. Non-default
# catalogs are never locked: their writers are served by the synthetic shim, so nothing contends
# for the object the lock would hold.
# routing.iceberg-pointer-guard.enabled=true
# routing.iceberg-pointer-guard.table-cache-ttl-ms=30000
# routing.iceberg-pointer-guard.table-cache-max-entries=10000
# routing.iceberg-pointer-guard.lock-enabled=true
# routing.iceberg-pointer-guard.lock-acquire-timeout-ms=10000

# -----------------------------------------------------------------------------
# Compatibility and federation
# -----------------------------------------------------------------------------
# Optional Hive compatibility mode: keep backend catName/catalogName such as "hive"
# in externalized HMS objects while dbName still uses the proxy namespace.
# Apache 3.1.3 frontends can also talk through the proxy to older Hortonworks 3.1.0.x
# backends; the proxy automatically downgrades selected *_req RPCs when needed.
# Optional frontend identity exposed by getVersion(): APACHE_3_1_3 (default),
# HORTONWORKS_3_1_0_3_1_0_78 for HDP 3.1.0.3.1.0.0-78,
# HORTONWORKS_3_1_0_3_1_5_6150_1 for HDP 3.1.0.3.1.5.6150-1, or
# APACHE_4_1_0 for Hive 4 clients downgraded to an Apache 3.1.3 backend
# (read + standard DDL only; data connectors / scheduled queries / stored
# procedures / packages / ACID v2-only APIs respond with UNKNOWN_METHOD).
# APACHE_4_1_0 is also accepted as a per-catalog backend runtime profile
# (catalog.<name>.runtime-profile=APACHE_4_1_0) when the catalog's external
# HMS already runs Hive 4; positional get_table and get_table_objects_by_name
# (removed in Hive 4) are auto-upgraded to their *_req equivalents.
compatibility.frontend-profile=APACHE_3_1_3
# Optional: path to Hortonworks standalone-metastore jar used to expose the matching
# HDP thrift frontend interface.
# compatibility.frontend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar
# compatibility.frontend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.5.6150-1.jar
# Optional: path to standalone-metastore jar used for isolated backend runtimes such as Hortonworks.
# compatibility.backend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar
# compatibility.backend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.5.6150-1.jar
# Optional: override backend runtime and jar per catalog in mixed deployments.
# catalog.catalog1.runtime-profile=HORTONWORKS_3_1_0_3_1_0_78
# catalog.catalog1.backend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar
# catalog.catalog1.runtime-profile=HORTONWORKS_3_1_0_3_1_5_6150_1
# catalog.catalog1.backend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.5.6150-1.jar
# catalog.catalog1.runtime-profile=APACHE_4_1_0
# catalog.catalog1.backend-standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-common-4.1.0.jar
federation.preserve-backend-catalog-name=false

# Optional: rewrite db.table references inside Hive view / materialized-view SQL text.
# This is a conservative, parser-less rewrite: string literals, comments and aliases are skipped,
# and references that cannot be resolved unambiguously are left untouched and logged at DEBUG.
# federation.view-text-rewrite.mode=REWRITE
# Only viewExpandedText is rewritten by default; set this to false to also rewrite the
# client-facing viewOriginalText.
# federation.view-text-rewrite.preserve-original-text=true
# Optional: rewrite EXTERNAL_TABLE LOCATION before the backend create/alter call.
# QUALIFY_UNQUALIFIED -> '/tmp/x' becomes '<target fs.defaultFS>/tmp/x'
# REWRITE_IF_SOURCE_DEFAULT_FS -> also rewrites 'hdfs://frontend-ns/tmp/x' to the target catalog default FS,
# but only when the incoming URI matches federation.external-table-location-rewrite.source-default-fs.
# When source-default-fs is omitted, the proxy uses catalog.<routing.default-catalog>.conf.fs.defaultFS.
# federation.external-table-location-rewrite.mode=QUALIFY_UNQUALIFIED
# federation.external-table-location-rewrite.mode=REWRITE_IF_SOURCE_DEFAULT_FS
# federation.external-table-location-rewrite.source-default-fs=hdfs://frontend-ns
# Optional: best-effort proxy-side physical delete for EXTERNAL_TABLE on DROP TABLE.
# Applies only to Apache 3.1.3 backends, only after a successful backend drop_table* call,
# and only when the table already has external.table.purge=true.
# Keep the allowlist narrow because matching locations are deleted recursively.
# federation.external-table-drop-purge.mode=BEST_EFFORT
# catalog.catalog1.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://ns-catalog1/tmp/,hdfs://ns-catalog1/data/external/

# -----------------------------------------------------------------------------
# Transactional DDL guard
# -----------------------------------------------------------------------------
# Optional: protect create_table / alter_table on MANAGED_TABLE.
# guard.transactional-ddl.mode=REJECT_TRANSACTIONAL                  -> reject managed transactional tables
# guard.transactional-ddl.mode=REWRITE_TRANSACTIONAL_TO_EXTERNAL     -> rewrite managed transactional to EXTERNAL_TABLE,
#   add external.table.purge=true, and remove transactional metadata
# guard.transactional-ddl.mode=REWRITE_TO_NON_TRANSACTIONAL -> keep MANAGED_TABLE but strip transactional metadata
# guard.transactional-ddl.mode=REWRITE_MANAGED_TO_EXTERNAL  -> rewrite ANY managed table to EXTERNAL_TABLE,
#   add external.table.purge=true (applies regardless of transactional metadata)
# If guard.transactional-ddl.client-addresses is omitted, the rule is applied to all clients.
# Otherwise it is applied only for the listed client IPs/CIDRs.
# guard.transactional-ddl.mode=REJECT_TRANSACTIONAL
# guard.transactional-ddl.client-addresses=10.10.0.15,10.20.0.0/16,2001:db8::/64

# -----------------------------------------------------------------------------
# Rate limiting / overload protection
# -----------------------------------------------------------------------------
# Optional token-bucket overload protection. Limits are independent: a request
# must pass every configured bucket that applies to it.
# requests-per-second is the steady refill rate; burst defaults to the same
# value when omitted.
#
# Per authenticated client principal (for Kerberos/SASL front doors):
# rate-limit.principal.requests-per-second=40
# rate-limit.principal.burst=80
#
# Per exact source IP:
# rate-limit.source.requests-per-second=25
# rate-limit.source.burst=50
#
# Aggregate per source CIDR/rule. Useful when bad clients fan out across many IPs.
# Multiple matching CIDR rules are all enforced.
# rate-limit.source-cidr.hs2-pool.cidrs=10.10.0.0/16,10.20.0.0/16
# rate-limit.source-cidr.hs2-pool.requests-per-second=200
# rate-limit.source-cidr.hs2-pool.burst=300
#
# Per HMS method family. Supported families:
# metadata_read, metadata_write, service_global_read, service_global_write,
# acid_namespace_bound_write, acid_id_bound_lifecycle, admin_introspection,
# compatibility_only_rpc
# rate-limit.method-family.metadata_read.requests-per-second=400
# rate-limit.method-family.metadata_read.burst=800
#
# Per logical catalog:
# rate-limit.catalog.catalog1.requests-per-second=250
# rate-limit.catalog.catalog1.burst=500
# rate-limit.catalog.catalog2.requests-per-second=120
#
# Separate high-risk RPC classes. A request can match several at once, for
# example lock RPCs also count toward write/txn when applicable.
# Supported classes: write, ddl, txn, lock
# rate-limit.rpc-class.write.requests-per-second=80
# rate-limit.rpc-class.ddl.requests-per-second=20
# rate-limit.rpc-class.txn.requests-per-second=40
# rate-limit.rpc-class.lock.requests-per-second=60
#
# Example production profile:
# rate-limit.principal.requests-per-second=60
# rate-limit.source.requests-per-second=30
# rate-limit.method-family.metadata_read.requests-per-second=600
# rate-limit.catalog.catalog1.requests-per-second=300
# rate-limit.rpc-class.ddl.requests-per-second=15
# rate-limit.rpc-class.txn.requests-per-second=30
# rate-limit.rpc-class.lock.requests-per-second=50

# -----------------------------------------------------------------------------
# Front-door security
# -----------------------------------------------------------------------------
# Server-side security: NONE or KERBEROS
security.mode=KERBEROS
security.server-principal=hive/_HOST@EXAMPLE.COM
security.client-principal=hive/_HOST@EXAMPLE.COM
security.keytab=/etc/security/keytabs/hms-proxy.keytab
# Default for catalog.<name>.impersonation-enabled below; each catalog can override it.
# Impersonation in any catalog requires security.mode=KERBEROS.
security.impersonation-enabled=false
# Optional: dedicated keytab for proxy -> backend HMS connections.
# Defaults to security.keytab when omitted.
security.client-keytab=/etc/security/keytabs/hms-proxy-client.keytab

# -----------------------------------------------------------------------------
# Delegation tokens and front-door HiveConf overrides
# -----------------------------------------------------------------------------
# Optional: front-door HiveConf overrides for the local delegation-token manager.
# Useful when your launch script does not put hive-site.xml on the proxy classpath.
# security.front-door-conf.hive.cluster.delegation.token.store.class=org.apache.hadoop.hive.metastore.security.ZooKeeperTokenStore
# security.front-door-conf.hive.cluster.delegation.token.store.zookeeper.connectString=zk1:2181,zk2:2181,zk3:2181
# security.front-door-conf.hive.cluster.delegation.token.store.zookeeper.znode=/hms-proxy-delegation-tokens
# Optional: ACL for new znode paths created by the token store.
# security.front-door-conf.hive.cluster.delegation.token.store.zookeeper.acl=sasl:hive:cdrwa
# Optional: delegation-token max lifetime in milliseconds.
# security.front-door-conf.hive.cluster.delegation.token.max-lifetime=604800000
# When security.mode=KERBEROS, ZooKeeperTokenStore uses the front-door credentials
# security.server-principal and security.keytab for SASL/Kerberos to ZooKeeper by default.
# It does not use security.client-principal/security.client-keytab, which are for backend HMS.
# Override these explicitly if ZooKeeper should use different credentials:
# security.front-door-conf.hive.metastore.kerberos.principal=hive/_HOST@EXAMPLE.COM
# security.front-door-conf.hive.metastore.kerberos.keytab.file=/etc/security/keytabs/hms-proxy.keytab
# If HiveServer2 connects as hive/_HOST and requests end-user delegation tokens,
# allow it on the proxy front door as well:
# security.front-door-conf.hadoop.proxyuser.hive.hosts=hs2-a.internal,hs2-b.internal
# security.front-door-conf.hadoop.proxyuser.hive.groups=*

# -----------------------------------------------------------------------------
# Synthetic read-lock store
# -----------------------------------------------------------------------------
# Required: persistent store for the proxy's synthetic non-ACID read-lock shim.
# synthetic-read-lock.store.mode must be set explicitly — there is no default.
# IN_MEMORY is safe only for single-instance deployments: non-default catalog synthetic
# locks will be lost on proxy restart or load-balancer failover, and the proxy logs
# a WARN on startup to surface that. Use ZOOKEEPER for HA / multi-instance setups
# so HS2 lock/check_lock/heartbeat/unlock/commit/abort can continue through a neighbor
# if the first proxy dies. This is not a distributed ACID coordinator: it only persists
# the proxy's synthetic non-transactional SELECT, NO_TXN DDL and write locks for
# non-default catalogs, and those locks are granted without any conflict checking.
# Setting mode=IN_MEMORY together with any synthetic-read-lock.store.zookeeper.* property is a
# startup error: the ZooKeeper settings would be ignored and locks would silently stay in memory.
# ZooKeeper properties without an explicit mode still select ZOOKEEPER.
synthetic-read-lock.store.mode=IN_MEMORY
# synthetic-read-lock.store.mode=ZOOKEEPER
# synthetic-read-lock.store.zookeeper.connect-string=zk1:2181,zk2:2181,zk3:2181
# synthetic-read-lock.store.zookeeper.znode=/hms-proxy-synthetic-read-locks
# synthetic-read-lock.store.zookeeper.connection-timeout-ms=15000
# synthetic-read-lock.store.zookeeper.session-timeout-ms=60000
# synthetic-read-lock.store.zookeeper.base-sleep-ms=1000
# synthetic-read-lock.store.zookeeper.max-retries=3
# When security.mode=KERBEROS, the synthetic read-lock store uses
# security.server-principal and security.keytab for ZooKeeper SASL/Kerberos.

# -----------------------------------------------------------------------------
# Shared backend defaults
# -----------------------------------------------------------------------------
# Optional: shared HiveConf for all outbound backend thrift clients.
# Any catalog.catalogX.conf.* setting below overrides the shared backend value.
# Duration values follow Hive: 45s, 45sec, 600ms, 5min, 2h, 1d; a bare number means seconds.
# backend.conf.hive.metastore.client.socket.timeout=45s
# backend.conf.hive.metastore.execute.setugi=true

# -----------------------------------------------------------------------------
# Catalogs
# -----------------------------------------------------------------------------
catalogs=catalog1,catalog2

# Catalog 1
catalog.catalog1.description=Primary warehouse
catalog.catalog1.location-uri=s3a://warehouse-a/
catalog.catalog1.impersonation-enabled=true
# Optional per-user impersonation backend session pool tuning.
# pool-max-size sizes the borrow/return pool of backend Thrift sessions per impersonated user
# (default 4). idle-ttl-ms closes idle sessions inside that pool (default 0 = never).
# catalog.catalog1.impersonation-pool-max-size=8
# catalog.catalog1.impersonation-session-idle-ttl-ms=120000
# Optional per-catalog write policy:
# READ_WRITE (default), READ_ONLY, READ_WRITE_DB_WHITELIST
# access-mode and write-db-whitelist must be set together: a whitelist is only enforced in
# READ_WRITE_DB_WHITELIST mode, so either one without the other is a startup error.
# Use READ_ONLY to forbid writes everywhere.
# catalog.catalog1.access-mode=READ_WRITE_DB_WHITELIST
# catalog.catalog1.write-db-whitelist=sales,analytics
# Optional selective federation exposure for metadata reads:
# expose-mode defaults to ALLOW_ALL for backward compatibility.
# Set DENY_BY_DEFAULT to publish only namespaces matched by the regex allowlists below.
# Regexes are matched case-insensitively against backend db/table names inside this catalog.
# catalog.catalog1.expose-mode=DENY_BY_DEFAULT
# catalog.catalog1.expose-db-patterns=sales,finance_.*
# catalog.catalog1.expose-table-patterns.sales=orders_.*,events
# catalog.catalog1.expose-table-patterns.finance_.*=audit_.*
# Optional per-catalog extra latency budget in milliseconds. Useful for slower metastores
# so adaptive timeouts and degraded fanout omission become less aggressive.
# catalog.catalog1.latency-budget-ms=750
catalog.catalog1.conf.hive.metastore.uris=thrift://hms-a.internal:9083
catalog.catalog1.conf.hive.metastore.sasl.enabled=true
catalog.catalog1.conf.hive.metastore.kerberos.principal=hive/_HOST@EXAMPLE.COM

# Catalog 2
catalog.catalog2.description=Cold archive warehouse
catalog.catalog2.location-uri=abfs://archive@storage.dfs.core.windows.net/warehouse/
catalog.catalog2.impersonation-enabled=false
# catalog.catalog2.latency-budget-ms=2500
catalog.catalog2.conf.hive.metastore.uris=thrift://hms-b.internal:9083
catalog.catalog2.conf.hive.metastore.sasl.enabled=true
catalog.catalog2.conf.hive.metastore.kerberos.principal=hive/_HOST@EXAMPLE.COM
