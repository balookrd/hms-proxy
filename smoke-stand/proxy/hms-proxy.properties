# hms-proxy configuration for the smoke stand.
#
# Two backends behind one front door:
#   hdp    -> Hortonworks 3.1.0.x metastore, the default catalog (owns ACID/txn state)
#   apache -> Apache 3.1.3 metastore, a non-default catalog (exercises the synthetic lock shim)
#
# Databases are exposed as <catalog>__<db>, so `hdp__default` and `apache__default`.

server.name=hms-proxy-smoke
server.bind-host=0.0.0.0
server.port=9083
server.min-worker-threads=8
server.max-worker-threads=64

# Second front door for Hortonworks-only RPCs (add_write_notification_log). Thrift has no version
# negotiation, so the HDP interface has to live on its own port: the primary listener keeps the
# Apache 3.1.3 shape that HiveServer2 3.1.3 speaks.
additional-frontends=hdp
additional-frontends.hdp.port=9084
additional-frontends.hdp.frontend-profile=HORTONWORKS_3_1_0_3_1_0_78
additional-frontends.hdp.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar

routing.default-catalog=hdp
routing.catalog-db-separator=__

catalogs=hdp,apache

catalog.hdp.conf.hive.metastore.uris=thrift://hms-hdp:9083
# The metastore runs a TUGIBasedProcessor, which refuses a second set_ugi on the same
# connection; the proxy manages identity itself, so the client must not send one on open.
catalog.hdp.conf.hive.metastore.execute.setugi=false
catalog.hdp.runtime-profile=HORTONWORKS_3_1_0_3_1_0_78
catalog.hdp.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar

catalog.apache.conf.hive.metastore.uris=thrift://hms-apache:9083
catalog.apache.conf.hive.metastore.execute.setugi=false
catalog.apache.runtime-profile=APACHE_3_1_3

# External-table purge: the proxy deletes the data itself on DROP ... PURGE, but only under
# paths the catalog explicitly allows.
federation.external-table-drop-purge.mode=BEST_EFFORT
catalog.hdp.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://namenode:8020/external/
catalog.apache.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://namenode-b:8020/external/

# Locks for non-default catalogs are served by the synthetic shim. In-memory keeps the stand to a
# single proxy instance; switch to ZOOKEEPER when testing failover.
# The two catalogs sit on different HDFS clusters, so an unqualified or foreign-cluster location
# has to be rewritten to the filesystem of the catalog that will own the table - otherwise the
# metastore records a path its own cluster cannot serve.
federation.external-table-location-rewrite.mode=REWRITE_IF_SOURCE_DEFAULT_FS
federation.external-table-location-rewrite.source-default-fs=hdfs://namenode:8020
catalog.hdp.conf.fs.defaultFS=hdfs://namenode:8020
catalog.apache.conf.fs.defaultFS=hdfs://namenode-b:8020

synthetic-read-lock.store.mode=IN_MEMORY

# Management endpoints for /healthz, /readyz and /metrics.
management.enabled=true
management.port=9090
management.bind-host=0.0.0.0
# Uncomment to check the transactional-DDL guard on the real create path (see README):
# guard.transactional-ddl.mode=REJECT_TRANSACTIONAL
