# hms-proxy configuration for cross-DC resilience smoke testing on the stand.
# Enables lenient startup, non-blocking readiness probing, table/partition metadata caches,
# serve-stale-on-error, WAN concurrency governor, and catalog shadow/replica fallback.

server.name=hms-proxy-cross-dc-smoke
server.bind-host=0.0.0.0
server.port=9083
server.min-worker-threads=8
server.max-worker-threads=256

additional-frontends=hdp,hive4fe
additional-frontends.hdp.port=9084
additional-frontends.hdp.frontend-profile=HORTONWORKS_3_1_0_3_1_0_78
additional-frontends.hdp.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar

additional-frontends.hive4fe.port=9085
additional-frontends.hive4fe.frontend-profile=APACHE_4_1_0
additional-frontends.hive4fe.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-common-4.1.0.jar

rest-catalog.enabled=true
rest-catalog.port=9183

routing.default-catalog=hdp
routing.catalog-db-separator=__

security.impersonation-enabled=true

# Table & Partition Metadata Caches (3s TTL for testing caching, hit/miss, and expiration)
routing.table-metadata-cache.ttl-ms=3000
routing.table-metadata-cache.max-entries=1000
routing.table-metadata-cache.shared-across-users=true

routing.partition-metadata-cache.ttl-ms=3000
routing.partition-metadata-cache.max-entries=1000
routing.partition-metadata-cache.shared-across-users=true

# Serve-Stale-on-Error configuration
routing.cache.serve-stale-on-error=true
routing.cache.stale-grace-period-ms=60000

catalogs=hdp,apache

# Local primary / default catalog
catalog.hdp.conf.hive.metastore.uris=thrift://hms-hdp:9083
catalog.hdp.conf.hive.metastore.execute.setugi=false
catalog.hdp.conf.hive.metastore.connect.retries=1
catalog.hdp.conf.hive.metastore.client.connect.retry.delay=1s
catalog.hdp.conf.hive.metastore.client.socket.timeout=3s
catalog.hdp.runtime-profile=HORTONWORKS_3_1_0_3_1_0_78
catalog.hdp.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar
catalog.hdp.startup-mode=STRICT
catalog.hdp.required-for-readiness=true

# Remote / secondary catalog with cross-DC resilience settings
catalog.apache.conf.hive.metastore.uris=thrift://hms-apache:9083
catalog.apache.conf.hive.metastore.execute.setugi=false
catalog.apache.conf.hive.metastore.connect.retries=1
catalog.apache.conf.hive.metastore.client.connect.retry.delay=1s
catalog.apache.conf.hive.metastore.client.socket.timeout=3s
catalog.apache.runtime-profile=APACHE_3_1_3
catalog.apache.startup-mode=LENIENT
catalog.apache.required-for-readiness=false
catalog.apache.max-concurrent-calls=10
catalog.apache.concurrency-timeout-ms=5000
catalog.apache.fallback-catalog=hdp
catalog.apache.fallback-on-outage=true

federation.external-table-drop-purge.mode=BEST_EFFORT
catalog.hdp.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://namenode:8020/external/
catalog.apache.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://namenode-b:8020/external/

federation.external-table-location-rewrite.mode=REWRITE_IF_SOURCE_DEFAULT_FS
federation.external-table-location-rewrite.source-default-fs=hdfs://namenode:8020
catalog.hdp.conf.fs.defaultFS=hdfs://namenode:8020
catalog.apache.conf.fs.defaultFS=hdfs://namenode-b:8020

synthetic-read-lock.store.mode=IN_MEMORY

# Management endpoints
management.enabled=true
management.port=9090
management.bind-host=0.0.0.0
management.readyz.require-all-catalogs=true
