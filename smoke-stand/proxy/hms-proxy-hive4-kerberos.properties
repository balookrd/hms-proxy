# hms-proxy configuration for the Kerberos variant of the hive4 profile: the same catalog layout
# as hms-proxy-hive4.properties (default catalog = Apache Hive 4.1.0 metastore, apache 3.1.3 as the
# non-default one), with the same SASL/SPNEGO shape as hms-proxy-kerberos.properties.

server.name=hms-proxy-smoke-hive4-kerberos
server.bind-host=0.0.0.0
server.port=9083
server.min-worker-threads=8
server.max-worker-threads=256

additional-frontends=hdp,hive4fe
additional-frontends.hdp.port=9084
additional-frontends.hdp.frontend-profile=HORTONWORKS_3_1_0_3_1_0_78
additional-frontends.hdp.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-3.1.0.3.1.0.0-78.jar
additional-frontends.hive4fe.port=9085
additional-frontends.hive4fe.frontend-profile=APACHE_4_1_0
additional-frontends.hive4fe.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-common-4.1.0.jar

rest-catalog.enabled=true
rest-catalog.port=9183
rest-catalog.kerberos.principal=HTTP/proxy@SMOKE.LOCAL
rest-catalog.kerberos.keytab=/keytabs/proxy.keytab

routing.default-catalog=hive4
routing.catalog-db-separator=__

catalogs=hive4,apache

catalog.hive4.conf.hive.metastore.uris=thrift://hms-hive4:9083
catalog.hive4.conf.hive.metastore.sasl.enabled=true
catalog.hive4.conf.hive.metastore.kerberos.principal=hive/hms-hive4@SMOKE.LOCAL
catalog.hive4.conf.hive.metastore.execute.setugi=false
catalog.hive4.runtime-profile=APACHE_4_1_0
catalog.hive4.standalone-metastore-jar=/opt/hms-proxy/hive-metastore/hive-standalone-metastore-common-4.1.0.jar

catalog.apache.conf.hive.metastore.uris=thrift://hms-apache:9083
catalog.apache.conf.hive.metastore.sasl.enabled=true
catalog.apache.conf.hive.metastore.kerberos.principal=hive/hms-apache@SMOKE.LOCAL
catalog.apache.conf.hive.metastore.execute.setugi=false
catalog.apache.runtime-profile=APACHE_3_1_3

security.mode=KERBEROS
security.server-principal=hive/proxy@SMOKE.LOCAL
security.keytab=/keytabs/proxy.keytab
security.outbound-principal=hive/proxy@SMOKE.LOCAL
security.outbound-keytab=/keytabs/proxy.keytab

# Same HDFS Kerberos client settings as hms-proxy-kerberos.properties: the REST create/commit
# path writes blocks to the datanodes, which needs the namenode principal AND SASL data-transfer
# protection - a client without the latter fails a real block write with "Connection reset".
catalog.hive4.conf.dfs.namenode.kerberos.principal=hdfs/namenode@SMOKE.LOCAL
catalog.apache.conf.dfs.namenode.kerberos.principal=hdfs/namenode-b@SMOKE.LOCAL
catalog.hive4.conf.dfs.namenode.kerberos.principal.pattern=*
catalog.apache.conf.dfs.namenode.kerberos.principal.pattern=*
catalog.hive4.conf.dfs.data.transfer.protection=authentication
catalog.apache.conf.dfs.data.transfer.protection=authentication
catalog.hive4.conf.hadoop.security.authentication=kerberos
catalog.apache.conf.hadoop.security.authentication=kerberos

federation.external-table-drop-purge.mode=BEST_EFFORT
catalog.hive4.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://namenode:8020/external/
catalog.apache.conf.hms.proxy.external-table-drop-purge.allowed-prefixes=hdfs://namenode-b:8020/external/

federation.external-table-location-rewrite.mode=REWRITE_IF_SOURCE_DEFAULT_FS
federation.external-table-location-rewrite.source-default-fs=hdfs://namenode:8020
catalog.hive4.conf.fs.defaultFS=hdfs://namenode:8020
catalog.apache.conf.fs.defaultFS=hdfs://namenode-b:8020

synthetic-read-lock.store.mode=IN_MEMORY

management.enabled=true
management.port=9090
management.bind-host=0.0.0.0
