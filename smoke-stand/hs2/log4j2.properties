status = warn
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %5p [%t] %c{2}: %m%n
rootLogger.level = info
rootLogger.appenderRef.console.ref = console

# Local MapReduce swallows task failures behind "return code 2": raise the runner and task
# loggers so the actual cause reaches the container log.
logger.localrunner.name = org.apache.hadoop.mapred.LocalJobRunner
logger.localrunner.level = debug
logger.mapredtask.name = org.apache.hadoop.mapred.Task
logger.mapredtask.level = debug
logger.hiveexec.name = org.apache.hadoop.hive.ql.exec.mr
logger.hiveexec.level = debug
